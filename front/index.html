<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark Monitor</title>
<link rel="icon" href="static/meter-dgx.ico">
<script src="static/chart.umd.js"></script>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card2: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --purple: #bc8cff;
  /* GPU サーマルガード発動中の枠線/インジケータ (--red/--yellow を落とした暗め版) */
  --thr-red: #9e3b3b;
  --thr-yellow: #9a7b1f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
/* ヘッダ行: タイトル / 時計 / P-State / サーマル + タブ + モデル選択・切替。
   タブバーをヘッダ行に統合するため padding を上下 0 にし、min-height で高さを固定する。
   .tabs は align-self:stretch + button height:100% で下線を header の border-bottom に付ける */
header {
  display: flex;
  align-items: stretch;
  gap: 12px;
  padding: 0 20px;
  min-height: 40px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  position: sticky;
  top: 0;
  z-index: 5;
}
header h1 { font-size: 15px; margin: 0; display: flex; align-items: center; }
header #pstate { font-size: 13px; font-weight: 600; align-self: center; }
header #thermal { font-size: 13px; font-weight: 600; align-self: center; }
main { padding: 12px 20px 10px; }
section { margin-bottom: 16px; }
section:last-child { margin-bottom: 0; } /* 最下段の余白を潰し、縦スクロールバー出現を遅らせる */
section > h2 {
  font-size: 14px;
  color: var(--muted);
  border-left: 3px solid var(--blue);
  padding-left: 8px;
  margin: 0 0 10px;
}
/* ---- タブ (システム / モデル): header 内 ---- */
.tabs {
  display: flex;
  align-self: stretch;
  gap: 20px;
  margin-left: 10px;
}
.tabs button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 0 2px;
  height: 100%;
  font-size: 13px;
  color: var(--muted);
}
.tabs button:hover { color: var(--text); border-bottom-color: var(--border); }
.tabs button.active { color: var(--text); font-weight: 600; border-bottom-color: var(--green); }
/* ---- ヘッダ行のモデル選択 (プルダウン) と切替/停止ボタン: モデルタブの直横 ---- */
.hdr-model {
  margin-left: 14px;
  align-self: center;
  display: flex;
  align-items: center;
  gap: 8px;
}
#hdr-model-select {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
  max-width: 320px;
}
#hdr-model-select:hover { border-color: var(--blue); }
/* 幅は最大ラベル (4 文字 = 「再作成中」) + 余白で決める。
   4em (日本語 1 字 = 1em = 12px × 4) + padding 8×2 + border 1×2 = 4em + 18px。
   em 指定なのでフォントや実機の違いにも追従する (固定 px だと「…」込みの実測値に縛られる)。
   white-space: nowrap で折り返しによる高さ変化 (2 行 = 38px) を防ぐ */
#hdr-switch-btn { padding: 4px 8px; font-size: 12px; min-width: calc(4em + 18px); text-align: center; white-space: nowrap; }
#hdr-switch-btn.stop { background: #33161a; border-color: #5c2b30; color: #e5534b; }
#hdr-switch-btn.stop:hover { border-color: var(--red); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
/* ---- 現在値: vLLM 情報テキストカード (ゲージ描画なし・文字のみ) ---- */
.gauge.vinfo-card { text-align: left; overflow: hidden; }
.gauge.vinfo-card .vi-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.gauge.vinfo-card .vi-row .k { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
.gauge.vinfo-card .vi-row .v { font-size: 10px; font-weight: 600; text-align: right; word-break: break-all; }
/* モデル名はラベルなしで値のみ。140px のカード幅に収め、他カードと高さを揃えるため
   1 行省略 (…) とし、フル名は title に入れる (setV が設定) */
.gauge.vinfo-card .vi-row .v.name {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: left;
}
/* ---- Tier 1 (半円ゲージ) ---- */
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.gauge {
  flex: 0 0 140px; /* 固定幅: 176px → 80% (140px)。10枚/行 × 140px + gap 10px × 9 = 1490px (main内側1560pxに収まる) */
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px 6px;
  text-align: center;
}
/* GPU サーマルガード発動中: 監視対象 (atom2/R9700=GPU温度、atom1/GB10=CPU温度・GPU温度の
   うち制限値に引っかかった方) と制限対象 (atom2=GPU電力、atom1=GPUクロック) のカード枠線を
   着色する。復帰 (上限=最大 / クロック解除) でクラスが外れ var(--border) の灰色に戻る。
   太さは変えない (他カードとの高さを揃えたまま色だけで判別させる) */
.gauge.thr-high { border-color: var(--thr-yellow); }
.gauge.thr-crit { border-color: var(--thr-red); }
.gauge .gtitle { color: var(--muted); font-size: 10px; margin-bottom: 3px; }
.gauge .gtitle .gdot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }
.gauge .gcanvas { position: relative; height: 60px; } /* 76px → 80% (4の倍数)。dual も単一と同じ 60px */
/* Chart.js (responsive:false) が canvas に論理サイズの inline style を付与するため width/height は
   指定しない (position/left/top は .gval の配置基準なので維持) */
.gauge .gcanvas canvas { position: absolute; left: 0; top: 0; }
.gauge .gval {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px; /* 16px → 80% */
  font-weight: 600;
  pointer-events: none;
}
.gauge .gval .unit { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
/* 二重メーターの 2 行値: 単一メーターと同じ書式に揃える。数値 (.gnum) は .gval の 13px 白をそのまま、
   接頭語 (.unit) は 11px グレー。ラベル (.glabel) は対応リングの色を inline style で当てる
   (DISK: R=緑 #56d364 / W=黄 #e3b341、NW: UP=青 #58a6ff / DL=紫 #bc8cff)。
   2 行目は RAM/VRAM の subVal と同じ .gval-sub に載せるため、その中の .gnum だけ 11px への上書きを 13px に戻す */
.gauge .gval .glabel { font-size: 11px; font-weight: 400; margin-right: 2px; }
.gauge .gval .gval-sub .gnum { font-size: 13px; }
.gauge .gval .gval-line { white-space: nowrap; }
.gauge .gval .gval-sub { position: absolute; top: 100%; left: 0; right: 0; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--text); }
.gauge .gsub { color: var(--muted); font-size: 11px; margin-top: 3px; min-height: 14px; }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.hot { color: var(--red); }
.v.down { color: var(--muted); } /* vLLM 行の「停止中」は灰色 */
.v.stale { color: var(--muted); } /* スループット: 前回値を保持中(held)は灰色 */
/* ---- Tier 2 ---- */
.charts-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
/* Tier 2 の見出しは h2 を 1 行に集約 (範囲ボタンを右寄せ)。section > h2 でなくなるため
   同じ見た目 (青い左バー + 14px グレー) をここで当てる */
.charts-head h2 {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
  border-left: 3px solid var(--blue);
  padding-left: 8px;
}
.range-btns { display: flex; gap: 6px; }
.range-btns button { padding: 4px 12px; font-size: 12px; border-radius: 14px; }
.range-btns button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px 6px;
}
.chart-card .cwrap { position: relative; height: 232px; } /* 288px → 80% (4の倍数) */
/* ---- Tier 3 ---- */
#vllm-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
/* ---- モデル一覧 (vLLM パネル常設: モーダルと同じ .model-item を再利用) ---- */
#panel-switch-warn {
  display: none;
  color: var(--red);
  font-size: 12px;
  margin-top: 10px;
  white-space: pre-line;
}
#panel-model-list { margin-top: 10px; }
/* 切替ログはモーダル廃止によりパネルのみ。従来同様 7 行固定でレイアウトの揺れを防ぐ */
#panel-switch-log {
  margin-top: 10px;
  line-height: 14px;
  height: 116px; /* 7行 × 14px + padding 16px + border 2px = 116px (border-box) */
}
#panel-switch-go { margin-top: 10px; }
#vllm-headline, #rag-headline { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 8px; }
#vllm-headline .item .k, #rag-headline .item .k { color: var(--muted); font-size: 11px; display: block; }
#vllm-headline .item .v, #rag-headline .item .v { font-size: 15px; font-weight: 600; }
#v-model { display: block; min-width: 10ch; }
#v-port { display: block; min-width: 5ch; text-align: center; }
#v-status { display: block; min-width: 18ch; text-align: left; }
#v-uptime { display: block; min-width: 7ch; text-align: center; }
#v-rw { display: block; min-width: 5ch; text-align: right; }
#v-kv { display: block; min-width: 7ch; text-align: right; }
#v-e2e { display: block; min-width: 3ch; text-align: right; }
#v-ttft { display: block; min-width: 5ch; text-align: right; }
#v-tps-in, #v-tps-out { display: block; min-width: 12ch; text-align: right; }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 11px;
  border: 1px solid var(--border);
}
.badge.up { color: var(--green); border-color: var(--green); }
.badge.down { color: var(--red); border-color: var(--red); }
.btns { margin-top: 10px; display: flex; gap: 10px; }
button {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
}
button:hover { border-color: var(--blue); }
button.primary { background: #1f6feb; border-color: #1f6feb; }
#btn-stop { background: #33161a; border-color: #5c2b30; color: #e5534b; }
#btn-stop:hover { border-color: var(--red); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* ---- モーダル ---- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.modal.hidden { display: none; }
.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: min(680px, 92vw);
  max-height: 84vh;
  overflow: auto;
  padding: 18px 20px;
}
.modal-box h3 { margin: 0 0 12px; font-size: 15px; }
.model-list { display: flex; flex-wrap: wrap; gap: 8px; }
.model-item {
  width: fit-content;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.model-item.selected { border-color: var(--blue); background: rgba(88,166,255,.08); }
.model-item .name { font-weight: 600; }
.model-item .meta { color: var(--muted); font-size: 12px; }
.model-item.current .meta { color: var(--green); }
.model-item.stopping .meta,
.model-item.switching .meta { color: var(--red); }
/* 重み未導入 (modelctl / WSL2): モデル名を灰色にして導入済みと区別する。
   選択・切替は不可 (makeModelItem / updateSwitchButtons で制御)。
   compose 環境 (atom1 / atom2) は containers に ready を出さないため
   このクラスは付与されず、表示は従来どおり。 */
.model-item.not-ready { cursor: default; }
.model-item.not-ready .name { color: var(--muted); }
.job-log {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: Consolas, monospace;
  font-size: 11px;
  white-space: pre;
  max-height: 220px;
  overflow-x: hidden; /* 横スクロールバーを出さず、オーバーフロー分を非表示(折り返しなし) */
  overflow-y: auto;
  margin-top: 12px;
  display: none;
}
.job-log:empty::before { content: "ログ"; color: var(--muted); } /* 内容なし時のプレースホルダー */
table.params { width: 100%; border-collapse: collapse; font-size: 13px; }
table.params th, table.params td {
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
}
table.params th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.params td input {
  width: 160px;
  background: #010409;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: Consolas, monospace;
}
table.params td input[readonly] { color: var(--muted); }
/* ---- Cline設定値モーダル ---- */
.cline-section { margin-bottom: 14px; }
.cline-section-title {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  border-left: 3px solid var(--purple);
  padding-left: 8px;
}
.cline-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.cline-row:last-child { border-bottom: none; }
.cline-label { flex: 0 0 200px; color: var(--muted); font-size: 13px; }
.cline-value {
  flex: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-family: Consolas, monospace;
  font-size: 13px;
}
.cline-part { word-break: break-all; }
.cline-sep { color: var(--muted); }
.cline-copy { flex: 0 0 auto; padding: 3px 10px; font-size: 11px; }
.cline-copy.copied { background: #1a3a1a; border-color: var(--green); color: var(--green); }
.cline-loading { color: var(--muted); padding: 10px 0; }
.cline-error { color: var(--red); padding: 10px 0; }
.modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 10px; }
/* ---- モデル実行ログモーダル (三段構成) ---- */
.log-box {
  display: flex;
  flex-direction: column;
  width: 100vw;
  max-height: 84vh;
  overflow: hidden;
  padding: 16px 18px;
}
.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-bottom: 10px;
}
.log-head h3 { margin: 0; }
.log-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.log-search-input {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  width: 220px;
}
.log-search-input.hidden { display: none; }
.log-content {
  flex: 1 1 auto;
  min-height: 180px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: hidden;
  overflow-y: auto;
  color: var(--text);
}
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">DGX Spark</h1>
  <span id="pstate"></span>
  <span id="thermal"></span>
  <!-- タブ (システム / モデル) はヘッダ行内。モデルタブの横にモデル選択と切替/停止ボタンを置く -->
  <div class="tabs">
    <button class="active" data-tab="system">システム</button>
    <button data-tab="model">モデル</button>
  </div>
  <div class="hdr-model">
    <select id="hdr-model-select"></select>
    <button id="hdr-switch-btn" disabled>切替</button>
  </div>
</header>
<main>
  <!-- タブ 1: システム (現在値 + 時系列) -->
  <div class="tab-panel active" id="tab-system">
  <!-- Tier 1: 現在値カード -->
  <section>
    <h2>現在値 (ホスト)</h2>
    <div class="grid" id="host-cards"></div>
  </section>

  <!-- Tier 2: 時系列グラフ (見出し行に範囲ボタンを右寄せ。h3 の副題は廃止) -->
  <section>
    <div class="charts-head">
      <h2>時系列 (全項目・2秒間隔)</h2>
      <div class="range-btns" id="range-btns">
        <button data-range="30m" class="active">直近30分</button>
        <button data-range="3h">直近3時間</button>
        <button data-range="all">すべて</button>
      </div>
    </div>
    <div class="chart-card">
      <div class="cwrap"><canvas id="ch-main"></canvas></div>
    </div>
  </section>
  </div>

  <!-- タブ 2: モデル (vLLM / モデル + RAG) -->
  <div class="tab-panel" id="tab-model">
  <!-- Tier 3: vLLM -->
  <section id="sec-model">
    <h2 id="h2-model">vLLM / モデル</h2>
    <div id="vllm-panel">
      <div id="vllm-headline">
        <div class="item"><span class="k">稼働モデル</span><span class="v" id="v-model">-</span></div>
        <div class="item"><span class="k">ポート</span><span class="v" id="v-port">-</span></div>
        <div class="item"><span class="k" id="k-status">コンテナ状態</span><span class="v" id="v-status">-</span></div>
        <div class="item"><span class="k">稼働時間</span><span class="v" id="v-uptime">-</span></div>
        <div class="item"><span class="k">実行/待機</span><span class="v" id="v-rw">-</span></div>
        <div class="item"><span class="k">KVCache</span><span class="v" id="v-kv">-</span></div>
        <div class="item"><span class="k">E2E</span><span class="v" id="v-e2e">-</span></div>
        <div class="item"><span class="k">TTFT</span><span class="v" id="v-ttft">-</span></div>
        <div class="item"><span class="k">prefill</span><span class="v" id="v-tps-in">-</span></div>
        <div class="item"><span class="k">decode</span><span class="v" id="v-tps-out">-</span></div>
      </div>
      <div class="btns">
        <button id="btn-log">ログ</button>
        <button id="btn-params">パラメータ</button>
        <button id="btn-cline">Cline設定値</button>
        <button id="btn-stop" disabled>停止</button>
      </div>
      <!-- モデル切替ポップアップと同じ一覧を常設表示し、この行の下から切替を実行できる -->
      <div id="panel-switch-warn"></div>
      <div class="model-list" id="panel-model-list"></div>
      <button class="primary" id="panel-switch-go" disabled>切り替え実行</button>
      <div class="job-log" id="panel-switch-log"></div>
    </div>
  </section>

  <section id="sec-rag">
    <h2>RAG (sociax-rag) <span id="rag-excl-note" style="display:none;color:var(--muted);font-size:12px;font-weight:400;">※ LLM ⇔ RAG は VRAM 排他</span></h2>
    <div id="rag-panel">
      <div id="rag-headline">
        <div class="item"><span class="k">Embedding (8010)</span><span class="v" id="r-emb">-</span></div>
        <div class="item"><span class="k">Qdrant (6333/6334)</span><span class="v" id="r-qdr">-</span></div>
        <div class="item"><span class="k">稼働時間</span><span class="v" id="r-uptime">-</span></div>
      </div>
      <div class="btns">
        <button class="primary" id="btn-rag-start" disabled>起動</button>

<script>
"use strict";

const API = "";  // 同一オリジン (FastAPI が front/ を配信)
const MAX_POINTS = 4500;   // 3時間 / 2秒
const POLL_MS = 2000;

// プラットフォーム情報 (/api/platform で取得。既定は DGX Spark 挙動 = 従来動作)
// memory_mode: unified=統合メモリ1枚 / discrete=RAM+VRAM 2枚
// backend: compose=docker-compose + switch_models.sh / modelctl=WSL の model-ctl.sh
// rag_enabled / params_editable: 各セクション・保存ボタンの表示可否
let PLAT = {
  platform: "dgx-spark", label: "DGX Spark", hostname: "",
  memory_mode: "unified", net_max_mbps: 10000, exclusive_llm_rag: false,
  backend: "compose", rag_enabled: true, params_editable: true,
};

// GPU サーマルガード (root unit の thermal-guard.service) の状態。/api/thermal で取得。
// 未取得・unit 停止時は {enabled:false} = インジケータなし・枠線は灰色のまま。
let THERMAL = { enabled: false };
const RANGE_SECS = { "30m": 1800, "3h": 10800, all: Infinity };

Chart.defaults.color = "#8b949e";
Chart.defaults.borderColor = "rgba(48,54,61,.6)";
Chart.defaults.font.family = '"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif';

// ------------------------------------------------------------- 時系列データ
const series = {
  ts: [],
  labels: [],
  cpuLoad: [], cpuTemp: [],
  memUsed: [], vramUsed: [],
  gpuLoad: [], gpuTemp: [], gpuPower: [], gpuClock: [],
  diskUsed: [],
  diskRead: [], diskWrite: [],
};

function pushPoint(ts, m) {
  series.ts.push(ts);
  series.labels.push(new Date(ts * 1000).toLocaleTimeString("ja-JP", { hour12: false }));
  series.cpuLoad.push(m.cpu_load_pct);
  series.cpuTemp.push(m.cpu_temp_c);
  series.memUsed.push(m.mem_used_pct);
  series.vramUsed.push(m.vram_used_pct);
  series.gpuLoad.push(m.gpu_load_pct);
  series.gpuTemp.push(m.gpu_temp_c);
  series.gpuPower.push(m.gpu_power_w);
  series.gpuClock.push(m.gpu_clock_mhz);
  series.diskUsed.push(m.disk_used_pct);
  series.diskRead.push(m.disk_read_mbps);
  series.diskWrite.push(m.disk_write_mbps);
  if (series.ts.length > MAX_POINTS) {
    for (const k of Object.keys(series)) series[k].shift();
  }
}

// 直近の /api/metrics レスポンス (システムタブへ戻ったときのゲージ再描画用)
let lastMetrics = null;

// 範囲切替用のフィルタ (ts 基準で先頭を切る)。初期起動時は直近30分を既定値とする
let rangeKey = "30m";
function rangeStartIdx() {
  if (rangeKey === "all" || !series.ts.length) return 0;
  const cutoff = series.ts[series.ts.length - 1] - RANGE_SECS[rangeKey];
  for (let i = 0; i < series.ts.length; i++) {
    if (series.ts[i] >= cutoff) return i;
  }
  return series.ts.length - 1;
}

function viewArrays() {
  const i = rangeStartIdx();
  const n = series.ts.length;
  const sl = (a) => (i === 0 ? a : a.slice(i, n));
  return {
    labels: sl(series.labels),
    cpuLoad: sl(series.cpuLoad), cpuTemp: sl(series.cpuTemp),
    memUsed: sl(series.memUsed), vramUsed: sl(series.vramUsed),
    gpuLoad: sl(series.gpuLoad), gpuTemp: sl(series.gpuTemp), gpuPower: sl(series.gpuPower),
    gpuClock: sl(series.gpuClock),
    diskUsed: sl(series.diskUsed),
    diskRead: sl(series.diskRead), diskWrite: sl(series.diskWrite),
  };
}

// ------------------------------------------------------- 半円ゲージ (Chart.js doughnut)
const ZONE_GREEN = "#3fb950";
const ZONE_ORANGE = "#d29922";
const ZONE_RED = "#f85149";
const ARC_BG = "rgba(48,54,61,.55)";
// README 仕様のゾーン閾値: 緑 < 60%、オレンジ 60〜85%、赤 > 85%
const ZONE_STOPS = [0.6, 0.85];
// リング間 1px の擬似余白の色 = カード背景 var(--card)。canvas 描画は CSS var を解決できないため実値
const CARD_BG = "#161b22";
// canvas の論理サイズ (responsive:false では属性サイズが論理サイズ)。カード 140px − padding 10×2
// − border 1×2 = 118px 幅、高さは .gcanvas と同じ 60px (単一・dual 共通)
const GW = 118, GH_SINGLE = 60;
// layout.padding {top:4, bottom:2} での Chart.js 実効外径 (高さ制約 = canvas 高さ − top − bottom)
const GAUGE_ROUT = 54;
// リング厚み = weight 配分 (1 weight ≈ 1px)。index 0 = 最外周の閾値ゾーン帯。80% 縮小 (3/11/8/6 → 2/9/6/5)
const W_ZONE = 2, W_VAL_SINGLE = 9, W_VAL_OUTER = 6, W_VAL_INNER = 5;

// 値 → アーチ %。canvas 版の Math.max(0, Math.min(1, val/max)) と同一 (null は 0 = アーチなし)
function toArcPct(v, max) {
  return v == null ? 0 : Math.max(0, Math.min(100, (v / max) * 100));
}

// 2 重メーター (DISK / NW) の値を「数値 + 接頭語」に分割する。単一メーターと同じ書式
// (数値=13px 白 / 接頭語=11px グレー) で出すため、文字列ではなく {n, s} で返す。
//   v >= base → G (GiB・Gbps)、それ以外 → M (MiB・Mbps)。1 未満も M のまま小数 1 桁 (例 R 0.4M)
// base は API の換算と同一基数 (disk は /1024/1024 = 1024、net は /1e6 = 1000)
function pfxParts(v, base) {
  if (v == null) return { n: "-", s: "" };
  if (v >= base) return { n: (v / base).toFixed(1), s: "G" };
  return { n: v.toFixed(1), s: "M" };
}

// 単一ゲージのアーチ色 (canvas 版 Gauge._zoneColor と同一の閾値判定)
function zoneColor(v, def) {
  const frac = Math.max(0, Math.min(1, v / def.max));
  const stops = def.zoneStops || ZONE_STOPS;
  if (frac > stops[1]) return ZONE_RED;
  if (frac > stops[0]) return ZONE_ORANGE;
  return ZONE_GREEN;
}

// 1 weight ≈ 1px になる穴比率 (canvas 版の値アーチ内縁 rA - lwA/2 相当)
function gaugeCutout(dual) {
  const sum = W_ZONE + (dual ? W_VAL_OUTER + W_VAL_INNER : W_VAL_SINGLE);
  return Math.round(((GAUGE_ROUT - sum) / GAUGE_ROUT) * 100) + "%";
}

// dataset 1 本 = 1 同心リング (index 0 = 最外周)。
//   ds0 閾値ゾーン帯 (緑/橙/赤ベタ・borderWidth:0)
//   ds1 単一=値アーチ (ゾーン色) / dual=外側 A (固定色)
//   ds2 dual のみ 内側 B (固定色)
// 値リングの残り分 (100-値) は ARC_BG = canvas 版の背景アーチ。
// 値リングの borderWidth:1 + borderColor=CARD_BG がリング間 1px の擬似余白 (operations-ui 準拠)。
// spacing はリング端が引っ込むため不使用。
function gaugeDatasets(def, v) {
  const s = def.zoneStops || ZONE_STOPS;
  const ds = [{
    data: [s[0] * 100, (s[1] - s[0]) * 100, (1 - s[1]) * 100],
    backgroundColor: [ZONE_GREEN, ZONE_ORANGE, ZONE_RED],
    borderWidth: 0,
    weight: W_ZONE,
  }];
  if (def.dual) {
    const a = v ? v.a : null, b = v ? v.b : null;
    const pa = toArcPct(a, def.max), pb = toArcPct(b, def.max);
    ds.push({ data: [pa, 100 - pa],
      backgroundColor: [a == null ? ARC_BG : def.colorA, ARC_BG],
      borderWidth: 1, borderColor: CARD_BG, weight: W_VAL_OUTER });
    ds.push({ data: [pb, 100 - pb],
      backgroundColor: [b == null ? ARC_BG : def.colorB, ARC_BG],
      borderWidth: 1, borderColor: CARD_BG, weight: W_VAL_INNER });
  } else {
    const p = toArcPct(v, def.max);
    ds.push({ data: [p, 100 - p],
      backgroundColor: [v == null ? ARC_BG : zoneColor(v, def), ARC_BG],
      borderWidth: 1, borderColor: CARD_BG, weight: W_VAL_SINGLE });
  }
  return ds;
}

class Gauge {
  constructor(id, def) {
    this.def = def;
    const el = document.getElementById(id);
    const wrap = el.parentElement; // .gcanvas
    const card = wrap.parentElement; // .gauge
    this.cardEl = card; // 項目未提供時の非表示制御用
    this.valEl = document.createElement("div");
    this.subEl = card.querySelector(".gsub");
    // dual も単一メーターと同じ .gval（canvas 中央）に 2 行を置く
    // (従来は 44px で内側アーチと交差したためゲージ下 .gval-dual-out に出していた)
    this.valEl.className = "gval";
    wrap.appendChild(this.valEl);
    // 半円ゲージ = doughnut の circumference:180 / rotation:-90 (operations-ui 準拠)。
    // responsive:false + canvas 属性サイズ固定: responsive:true はコンテナ計測が効かず
    // canvas が既定 300px 幅のまま右へはみ出す (operations-ui で実測済み)
    this.chart = new Chart(el, {
      type: "doughnut",
      data: { datasets: gaugeDatasets(def, null) },
      options: {
        responsive: false,
        circumference: 180,
        rotation: -90,
        cutout: gaugeCutout(!!def.dual),
        // 頂部/下端の余白。Chart.js の半円 doughnut は中心 y = canvas 高さ − padding.bottom になる
        // (offsetY=0.5 の効果)。canvas 版の cy = h - 2 に一致させ、外径も R = 69/50 に揃える
        layout: { padding: { top: 4, bottom: 2 } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        animation: { duration: 1000, easing: "easeInOutQuad" },
      },
    });
    this._last = null;
  }
  set(v, m) {
    const key = this.def.dual ? v.a + "|" + v.b : v;
    if (key === this._last) return;
    this._last = key;
    this.render(v);
    if (this.def.dual) {
      // 単一メーターと同じ書式・同じ開始位置: 1 行目 = A (外側リング) を中央、2 行目 = B (内側リング) を
      // その下 (RAM/VRAM の subVal と同じ .gval-sub)。数値は 13px 白、ラベルは対応リングの色、
      // 接頭語は 11px グレー
      const line = (label, val, color, sub) => {
        const p = this.def.pfx(val);
        return `<div class="gval-line${sub ? " gval-sub" : ""}">` +
          `<span class="glabel" style="color:${color}">${label}</span>` +
          `<span class="gnum">${p.n}</span><span class="unit">${p.s}</span></div>`;
      };
      this.valEl.innerHTML =
        line(this.def.labelA, v.a, this.def.colorA, false) +
        line(this.def.labelB, v.b, this.def.colorB, true);
    } else {
      this.valEl.innerHTML =
        (v == null ? "-" : this.def.fmt(v)) +
        (this.def.unit ? `<span class="unit">${this.def.unit}</span>` : "") +
        (this.def.subVal ? `<div class="gval-line gval-sub">${this.def.subVal(m)}</div>` : "");
    }
    this.subEl.textContent = this.def.sub ? this.def.sub(m) : "";
  }
  render(v) {
    // dataset オブジェクトは保持し data / backgroundColor だけ書き換える。
    // datasets を丸ごと差し替えると Chart.js は新規データとみなし毎回 0 からアニメする
    // (operations-ui「CPU負荷メーターの Chart.js 移植」で実測済みの教訓)
    const nds = gaugeDatasets(this.def, v);
    const cds = this.chart.data.datasets;
    cds.forEach((d, i) => {
      d.data = nds[i].data;
      d.backgroundColor = nds[i].backgroundColor;
    });
    this.chart.update();
  }
}

// プラットフォーム別ゲージ定義 (PLAT.memory_mode / net_max_mbps に応じる)
function gaugeDefs() {
  const discrete = PLAT.memory_mode === "discrete";
  const netMax = PLAT.net_max_mbps || 10000;
  const defs = [
    { id: "g-cpu-load", title: "CPU 負荷", max: 100, unit: "%", color: "#58a6ff",
      dotBg: "rgba(88,166,255,.10)", // ■=2段目グラフの凡例ボックスと同一スタイル(塗り+枠)
      get: (m) => m.cpu_load_pct, fmt: (v) => v.toFixed(1), sub: (m) => (m.cpu_cores ? m.cpu_cores + " cores" : "") },
    { id: "g-cpu-temp", title: "CPU 温度", max: 100, unit: "°C", color: "#f85149",
      get: (m) => m.cpu_temp_c, fmt: (v) => v.toFixed(0), sub: () => "上限 100°C" },
  ];
  if (discrete) {
    // atom2 (R9700): RAM と VRAM は別物 → ゲージ 2 枚構成
    defs.push(
      { id: "g-ram", title: "RAM", max: 100, unit: "%", color: "#3fb950",
        bg: "rgba(63,185,80,.10)", dotBg: "rgba(63,185,80,.30)",
        get: (m) => m.mem_used_pct, fmt: (v) => v.toFixed(1),
        subVal: (m) => `空き ${(m.mem_total_gib - m.mem_used_gib).toFixed(1)} GiB`,
        sub: (m) => `${m.mem_used_gib.toFixed(1)} / ${m.mem_total_gib.toFixed(1)} GiB` },
      { id: "g-vram", title: "VRAM", max: 100, unit: "%", color: "#39c5cf",
        bg: "rgba(57,197,207,.10)", dotBg: "rgba(57,197,207,.30)",
        get: (m) => m.vram_used_pct, fmt: (v) => v.toFixed(1),
        subVal: (m) => `空き ${(m.vram_total_gib - m.vram_used_gib).toFixed(1)} GiB`,
        sub: (m) => `${m.vram_used_gib.toFixed(1)} / ${m.vram_total_gib.toFixed(1)} GiB` });
  } else {
    // DGX Spark (GB10): CPU/GPU 共有メモリ → 「統合メモリ」1 枚 (従来どおり)
    defs.push(
      { id: "g-mem", title: "統合メモリ", max: 100, unit: "%", color: "#3fb950",
        bg: "rgba(63,185,80,.10)", dotBg: "rgba(63,185,80,.30)",
        get: (m) => m.mem_used_pct, fmt: (v) => v.toFixed(1),
        subVal: (m) => `空き ${(m.mem_total_gib - m.mem_used_gib).toFixed(1)} GiB`, // メーター内2行目
        sub: (m) => `${m.mem_used_gib.toFixed(1)} / ${m.mem_total_gib.toFixed(1)} GiB` });
  }
  defs.push(
    { id: "g-gpu-load", title: "GPU 負荷", max: 100, unit: "%", color: "#d29922",
      bg: "rgba(210,153,34,.10)", dotBg: "rgba(210,153,34,.30)",
      get: (m) => m.gpu_load_pct, fmt: (v) => v.toFixed(0), sub: () => "" },
    { id: "g-gpu-temp", title: "GPU 温度", max: discrete ? 110 : 100, unit: "°C", color: "#ff7b72",
      get: (m) => m.gpu_temp_c, fmt: (v) => v.toFixed(0),
      sub: (m) => `上限 ${m.gpu_temp_crit_c ? m.gpu_temp_crit_c.toFixed(0) : (discrete ? 110 : 100)}°C` },
    { id: "g-gpu-power", title: "GPU 電力", max: discrete ? 300 : 140, unit: "W", color: "#bc8cff",
      get: (m) => m.gpu_power_w, fmt: (v) => v.toFixed(1),
      sub: (m) => `上限 ${m.gpu_power_cap_w ? m.gpu_power_cap_w.toFixed(0) : (discrete ? 300 : 140)} W` },
    { id: "g-gpu-clock", title: "GPU クロック", max: discrete ? 2350 : 3003, unit: "MHz", color: "#8b949e",
      zoneStops: discrete ? undefined : [2520 / 3003, 2700 / 3003], // DGX のみ運用実測値のゾーン
      get: (m) => m.gpu_clock_mhz, fmt: (v) => v.toFixed(0),
      sub: (m) => `最大 ${m.gpu_clock_max_mhz ? m.gpu_clock_max_mhz.toFixed(0) : (discrete ? 2350 : 3003)} MHz` },
    { id: "g-disk-used", title: "ストレージ使用率", max: 100, unit: "%", color: "#79c0ff",
      // サブ行は必ず 1 行に収める (カード幅 118px で 2 行折り返しになると行高さが 14px 増えるため、
      // 単位は総量に合わせて末尾に 1 回だけ付ける)
      get: (m) => m.disk_used_pct, fmt: (v) => v.toFixed(1),
      sub: (m) => (m.disk_total_gib >= 1024
        ? `${(m.disk_used_gib / 1024).toFixed(2)} / ${(m.disk_total_gib / 1024).toFixed(2)} TiB`
        : `${Math.round(m.disk_used_gib)} / ${Math.round(m.disk_total_gib)} GiB`) },
    // タイトルに単位、値は接頭語のみ (R 0.0M / W 1.2G)。A = 外側リング = 1 行目
    { id: "g-disk-io", title: "DISK(B/s)", dual: true, max: 5000,
      colorA: "#56d364", colorB: "#e3b341", labelA: "R", labelB: "W",
      getA: (m) => m.disk_read_mbps, getB: (m) => m.disk_write_mbps,
      pfx: (v) => pfxParts(v, 1024), sub: () => "上限 5 GB/s" },
    // 上り (UP) を A (=外側リング・1 行目) にした (従来は下りが A)。単位は bps でタイトルに明記
    { id: "g-net", title: "NW(bps)", dual: true, max: netMax,
      colorA: "#58a6ff", colorB: "#bc8cff", labelA: "UP", labelB: "DL",
      getA: (m) => m.net_up_mbps, getB: (m) => m.net_down_mbps,
      pfx: (v) => pfxParts(v, 1000),
      // 上限は実測リンク速度 (/api/metrics の net_max_mbps で tuneGauge が随時更新)
      sub() { const v = this.max; return `上限 ${v >= 1000 ? v / 1000 + " Gbps" : v + " Mbps"}` } },
  );
  return defs;
}

let gages = [];

// 現在値ゲージ行の末尾に追加する vLLM 情報のテキスト専用カード (ゲージ描画なし)。
// ID は vLLM 行の #v-* と衝突させないため #vi-* とし、setV() のミラーで同一値を流し込む。
const VINFO_CARD = `
   <div class="gauge vinfo-card">
     <div class="vi-row"><span class="v name" id="vi-model">-</span></div>
     <div class="vi-row"><span class="k">ポート</span><span class="v" id="vi-port">-</span></div>
     <div class="vi-row"><span class="k">状態</span><span class="v" id="vi-status">-</span></div>
     <div class="vi-row"><span class="k">prefill</span><span class="v" id="vi-prefill">-</span></div>
     <div class="vi-row"><span class="k">decode</span><span class="v" id="vi-decode">-</span></div>
   </div>`;

// 半円ゲージ DOM 生成 (プラットフォーム確定後に呼ぶ)
function buildHostCards() {
  const defs = gaugeDefs();
  document.getElementById("host-cards").innerHTML = defs.map((d) => {
    const dots = d.dual
      ? `<span class="gdot" style="background:${d.colorA}"></span><span class="gdot" style="background:${d.colorB}"></span>`
      : `<span class="gdot" style="background:${d.dotBg || "transparent"};border:1px solid ${d.color}"></span>`;
    return `<div class="gauge${d.dual ? " dual" : ""}"${d.bg ? ` style="background:${d.bg}"` : ""}>
       <div class="gtitle">${dots}${d.title}</div>
       <div class="gcanvas"><canvas id="${d.id}" width="${GW}" height="${GH_SINGLE}"></canvas></div>
       <div class="gsub"></div>
     </div>`;
  }).join("") + VINFO_CARD;
  gages = defs.map((d) => new Gauge(d.id, d));
}

// 上限の実測値補正: amdgpu sysfs の cap/crit/max や NIC リンク速度が
// プラットフォーム既定値があれば上書き
function tuneGauge(g, m) {
  const d = g.def;
  let max = null;
  if (d.id === "g-gpu-power" && m.gpu_power_cap_w) max = m.gpu_power_cap_w;
  if (d.id === "g-gpu-clock" && m.gpu_clock_max_mhz) max = m.gpu_clock_max_mhz;
  if (d.id === "g-gpu-temp" && m.gpu_temp_crit_c) max = m.gpu_temp_crit_c;
  if (d.id === "g-net" && m.net_max_mbps) max = m.net_max_mbps;
  if (max !== null && max !== d.max) {
    d.max = max;
    g._last = null; // 上限変更時はキャッシュ無効化で再描画
    if (d.id === "g-gpu-clock" && PLAT.memory_mode === "discrete") d.zoneStops = undefined;
  }
}

function renderGauges(m) {
  for (const g of gages) {
    const d = g.def;
    tuneGauge(g, m);
    // バックエンド未提供の項目 (undefined) はゲージ自体を非表示。
    // null は差分計測初回等の「測定待ち」なので "-" 表示で可視のまま。
    const missing = d.dual
      ? (d.getA(m) === undefined && d.getB(m) === undefined)
      : d.get(m) === undefined;
    if (g.cardEl) g.cardEl.style.display = missing ? "none" : "";
    if (missing) continue;
    g.set(d.dual ? { a: d.getA(m), b: d.getB(m) } : d.get(m), m);
  }
}

// ------------------------------------------------------------- 統合時系列グラフ
// 100% 換算: CPU温度=100°C / ストレージI/O=5GB/s / GPU電力=GB10 140W (TDP)・R9700 300W (PPT) /
// GPUクロック=GB10 3003MHz・R9700 2350MHz (HW上限)
const toPct = (arr, max) => arr.map((v) => (v == null ? null : v / max * 100));

const lineDS = (label, data, color, fill) => ({
  label, data, borderColor: color,
  backgroundColor: fill || "transparent",
  tension: 0.35, pointRadius: 0, borderWidth: 2,
  spanGaps: true,
});

let mainChart = null;   // buildMainChart() で生成 (プラットフォーム確定後)
let chartDs = null;     // ラベル参照用のデータセット辞書
let CHART_NORM = null;  // 100% 換算基準

function buildMainChart() {
  const discrete = PLAT.memory_mode === "discrete";
  CHART_NORM = { cpuTemp: 100, gpuPower: discrete ? 300 : 140, gpuClock: discrete ? 2350 : 3003, diskIO: 5000 };
  const N = CHART_NORM;
  chartDs = {
    cpuLoad: lineDS("CPU %", series.cpuLoad, "#58a6ff", "rgba(88,166,255,.10)"),
    cpuTemp: lineDS("CPU ℃", toPct(series.cpuTemp, N.cpuTemp), "#f85149"),
    memUsed: { ...lineDS(discrete ? "RAM %" : "メモリ %", series.memUsed, "#3fb950", "rgba(63,185,80,.30)"), fill: true },
    gpuLoad: { ...lineDS("GPU %", series.gpuLoad, "#d29922", "rgba(210,153,34,.30)"), fill: true },
    gpuTemp: lineDS("GPU ℃", toPct(series.gpuTemp, N.cpuTemp), "#ff7b72"),
    gpuPower: lineDS("GPU W", toPct(series.gpuPower, N.gpuPower), "#bc8cff"),
    gpuClock: lineDS("GPU MHz", toPct(series.gpuClock, N.gpuClock), "#8b949e"), // グレー=ゲージラベルマーカーと同色
    diskUsed: lineDS("DISK %", series.diskUsed, "#79c0ff"),
    diskRead: lineDS("DISK Read", toPct(series.diskRead, N.diskIO), "#56d364"),
    diskWrite: lineDS("DISK Write", toPct(series.diskWrite, N.diskIO), "#e3b341"),
  };
  const datasets = [chartDs.cpuLoad, chartDs.cpuTemp, chartDs.memUsed];
  if (discrete) {
    // atom2: VRAM は RAM と別系列 (シアン=VRAM ゲージと同色)
    chartDs.vramUsed = { ...lineDS("VRAM %", series.vramUsed, "#39c5cf", "rgba(57,197,207,.30)"), fill: true };
    datasets.push(chartDs.vramUsed);
  }
  datasets.push(chartDs.gpuLoad, chartDs.gpuTemp, chartDs.gpuPower, chartDs.gpuClock,
    chartDs.diskUsed, chartDs.diskRead, chartDs.diskWrite);
  mainChart = new Chart(document.getElementById("ch-main"), {
    type: "line",
    data: { labels: [], datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { ticks: { maxTicksLimit: 10, maxRotation: 0, font: { size: 10 } } },
        y: { min: 0, max: 100, ticks: { callback: (v) => v + "%" } },
      },
    },
  });
}

function refreshMainChart() {
  if (!mainChart) return;
  const v = viewArrays();
  const N = CHART_NORM;
  // 100% 換算基準の実測上限補正 (tuneGauge() と同じ思想)。
  // buildMainChart() 時点の discrete 既定値 (2350MHz / 300W) は R9700 前提で、
  // WSL の RTX 5090 (clocks.max.sm=3090MHz / power.limit=600W) では基準が低く
  // グラフが 100% を超えた。API が gpu_clock_max_mhz / gpu_power_cap_w を返す
  // 環境ではそれに追随させる (unified = GB10 はキーなし → 既定値のまま)。
  if (lastMetrics) {
    if (lastMetrics.gpu_clock_max_mhz) N.gpuClock = lastMetrics.gpu_clock_max_mhz;
    if (lastMetrics.gpu_power_cap_w) N.gpuPower = lastMetrics.gpu_power_cap_w;
  }
  const ds = chartDs;
  mainChart.data.labels = v.labels;
  ds.cpuLoad.data = v.cpuLoad;
  ds.cpuTemp.data = toPct(v.cpuTemp, N.cpuTemp);
  ds.memUsed.data = v.memUsed;
  if (ds.vramUsed) ds.vramUsed.data = v.vramUsed;
  ds.gpuLoad.data = v.gpuLoad;
  ds.gpuTemp.data = toPct(v.gpuTemp, N.cpuTemp);
  ds.gpuPower.data = toPct(v.gpuPower, N.gpuPower);
  ds.gpuClock.data = toPct(v.gpuClock, N.gpuClock);
  ds.diskUsed.data = v.diskUsed;
  ds.diskRead.data = toPct(v.diskRead, N.diskIO);
  ds.diskWrite.data = toPct(v.diskWrite, N.diskIO);
  mainChart.update("none");
}

// 横軸範囲切替 (直近30分 / 直近3時間 / すべて)
document.querySelectorAll("#range-btns button").forEach((btn) => {
  btn.onclick = () => {
    rangeKey = btn.dataset.range;
    document.querySelectorAll("#range-btns button").forEach((b) => b.classList.toggle("active", b === btn));
    refreshMainChart();
  };
});

// ------------------------------------------------------------- タブ切替 (システム / モデル)
// 非表示タブ (display:none) 中のゲージは値が変わっても chart.update() が走るだけで視覚的に反映されない。
// システムタブへ戻るときはゲージのキャッシュ(_last)を無効化して全ゲージを update() し直す。
// ゲージは responsive:false (canvas 属性サイズが論理サイズ) なのでサイズ復元は不要で、
// line の mainChart は responsive:true のため resize() が必要。
function redrawSystemTab() {
  if (!lastMetrics) return;
  for (const g of gages) g._last = null;
  renderGauges(lastMetrics);
  if (mainChart) {
    mainChart.resize();
    refreshMainChart();
  }
}

// タブ切替 (ヘッダ行のタブボタン / ヘッダの切替ボタンから呼ぶ)
function showTab(key) {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === key));
  document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + key));
  if (key === "system") redrawSystemTab();
}
document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.onclick = () => showTab(btn.dataset.tab);
});
</script>
<script>
// ------------------------------------------------------------- Tier 3 (vLLM)
// vLLM 行 (#v-*) の表示を現在値カードのテキスト表示 (#vi-*) へミラーする対応表。
// setV() に集約するため、稼働モデルなしの "-" クリアや白/灰(stale)・up/down の色も両側へ同時に反映される。
const V_MIRROR = {
  "v-model": "vi-model",
  "v-port": "vi-port",
  "v-status": "vi-status",
  "v-tps-in": "vi-prefill",
  "v-tps-out": "vi-decode",
};

function setV(id, text, cls) {
  const cls2 = "v" + (cls ? " " + cls : "");
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = cls2;
  const mid = V_MIRROR[id];
  if (!mid) return;
  const mel = document.getElementById(mid);
  if (!mel) return;
  mel.textContent = text;
  mel.className = cls2 + (mel.classList.contains("name") ? " name" : "");
  if (mel.classList.contains("name")) mel.title = text; // 1行省略されたモデル名の救済
}

// 入力/出力スループットの最終更新時刻(ms)。
// 「更新」= API が非ゼロの新しい計測値を返した場合。0/null は更新とみなさない(前回値を保持)。
// 同時更新(同じポーリング)なら等値 → 両方白。
let tpsLastUpdate = { in: null, out: null };

// E2E・TTFT・入力/出力スループットの前回値保持(front 側)。
// API の算出値が 0/None のとき前回値を維持表示する。稼働モデル消失・モデル切替でリセット。
let heldMetrics = { e2e: null, ttft: null, in: null, out: null };
let heldProfile = null;

// 算出値が非ゼロなら保持値を更新して返す。0/null は保持値を返す(4 値共通)。
function pickMetric(cur, key) {
  if (cur != null && cur > 0) {
    heldMetrics[key] = cur;
    return cur;
  }
  return heldMetrics[key];
}

// 稼働モデルなしのときに "-" へ戻す項目 (ポート 〜 出力スループット)。
// 前回値保持 (heldMetrics) はモデル稼働中だけのものなので、稼働モデルがいない状態で
// 古いポート・稼働時間・メトリクスを残さない。
const V_METRIC_IDS = [
  "v-port", "v-uptime", "v-rw", "v-kv",
  "v-e2e", "v-ttft", "v-tps-in", "v-tps-out",
];

function clearVllmMetrics() {
  for (const id of V_METRIC_IDS) setV(id, "-");
}

function renderVllm(st) {
  const a = st.active;
  // 停止ボタン: 稼働中モデルがあり、かつジョブ実行中でないときのみ有効
  document.getElementById("btn-stop").disabled = !a || !!(st.switching);
  // ログボタン: 稼働中モデルがあるときのみ有効 (読み取り専用なので切替中も表示可)
  document.getElementById("btn-log").disabled = !a;
  // Cline設定値ボタン: 稼働中モデルがあるときのみ有効 (読み取り専用なので切替中も表示可)
  document.getElementById("btn-cline").disabled = !a;
  // 切替ジョブ実行中は動作状況をコンテナ状態に同期する("切替中…" 赤)
  const swJob = st.switching && st.switching.kind === "switch" ? st.switching : null;
  if (!a) {
    // 稼働モデル消失: 保持値・白/灰状態をリセットし、ポート〜出力スループットを "-" にクリア
    heldMetrics = { e2e: null, ttft: null, in: null, out: null };
    heldProfile = null;
    tpsLastUpdate = { in: null, out: null };
    clearVllmMetrics();
    setV("v-model", "稼働中のモデルなし");
    setV("v-status", swJob ? "切替中…" : "停止中", swJob ? "hot" : "down");
    return;
  }
  const stopJob = st.switching && st.switching.kind === "stop" ? st.switching : null;
  setV("v-model", a.profile);
  setV("v-port", a.port != null ? String(a.port) : "-");
  if (swJob) {
    // 切替中: 旧モデルがまだ稼働中 / 新モデルのAPI未応答の遷移期間も動作状況を表示
    setV("v-status", "切替中…", "hot");
  } else if (stopJob && stopJob.profile === a.profile) {
    // 稼働中 → 停止中…(赤) → 完了後は active が null になり「停止中」(灰)
    setV("v-status", "停止中…", "hot");
  } else {
    setV("v-status", a.health ? "稼働中" : "API応答なし", a.health ? "up" : "warn");
  }
  setV("v-uptime", a.uptime_str || "-");
  // モデル切替(稼働 profile 変化)で保持値・白/灰状態をリセット(エンジン別で値が非連続)
  if (a.profile !== heldProfile) {
    heldMetrics = { e2e: null, ttft: null, in: null, out: null };
    tpsLastUpdate = { in: null, out: null };
    heldProfile = a.profile;
  }
  const mt = a.metrics || {};
  const run = mt.requests_running != null ? Math.round(mt.requests_running) : "-";
  const wait = mt.requests_waiting != null ? Math.round(mt.requests_waiting) : "-";
  setV("v-rw", run === "-" && wait === "-" ? "-" : run + " / " + wait);
  setV("v-kv", mt.kv_cache_usage_pct != null ? mt.kv_cache_usage_pct.toFixed(1) + " " : "-");
  // E2E・TTFT: 0/None のとき前回値を維持表示
  const e2e = pickMetric(mt.e2e_latency_s, "e2e");
  const ttft = pickMetric(mt.ttft_s, "ttft");
  setV("v-e2e", e2e != null ? e2e.toFixed(1) + " s" : "-");
  setV("v-ttft", ttft != null ? ttft.toFixed(2) + " s" : "-");
  // スループットの白/灰: 最終更新(非ゼロ計測)が新しい側が白、古くなった側が灰。
  // 同じポーリングで両方更新なら(同一時刻)次更新まで両白、片方が更新されなければ前回の色を維持。
  const nowTs = Date.now();
  const tpsIn = pickMetric(mt.prompt_tokens_per_s, "in");
  const tpsOut = pickMetric(mt.generation_tokens_per_s, "out");
  const inUpdated = mt.prompt_tokens_per_s != null && mt.prompt_tokens_per_s > 0;
  const outUpdated = mt.generation_tokens_per_s != null && mt.generation_tokens_per_s > 0;
  if (inUpdated) tpsLastUpdate.in = nowTs;
  if (outUpdated) tpsLastUpdate.out = nowTs;
  const inWhite = tpsLastUpdate.in != null && tpsLastUpdate.in >= tpsLastUpdate.out;
  const outWhite = tpsLastUpdate.out != null && tpsLastUpdate.out >= tpsLastUpdate.in;
  setV("v-tps-in", tpsIn != null ? tpsIn.toFixed(1) + " tok/s" : "-",
    inWhite ? "" : "stale");
  setV("v-tps-out", tpsOut != null ? tpsOut.toFixed(1) + " tok/s" : "-",
    outWhite ? "" : "stale");
}

// ------------------------------------------------------------- ポーリング
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

async function poll() {
  try {
    const m = await fetchJson(API + "/api/metrics");
    lastMetrics = m;
    pushPoint(m.timestamp, m);
    renderGauges(m);
    refreshMainChart();
    renderPstate(m);
  } catch (e) {
    console.error("metrics poll failed", e);
  }
  try {
    const st = await fetchJson(API + "/api/vllm/status");
    renderVllm(st);
    currentStatus = st;
    // モデル一覧はパネル常設のため毎ポーリングで状態更新する (モーダルが開いていれば同じ描画が反映される)
    renderModelList();
  } catch (e) {
    console.error("vllm poll failed", e);
  }
  // RAG 環境が無いプラットフォーム (WSL) は docker を叩かないので poll も省略する
  if (PLAT.rag_enabled !== false) {
    try {
      const rst = await fetchJson(API + "/api/rag/status");
      ragStatus = rst;
      renderRag(rst);
      // ヘッダのプルダウンは RAG を含むので、RAG の稼働状態もここで反映する
      renderHdrModel();
    } catch (e) {
      console.error("rag poll failed", e);
    }
  }
  try {
    THERMAL = await fetchJson(API + "/api/thermal");
  } catch (e) {
    THERMAL = { enabled: false };
    console.error("thermal poll failed", e);
  }
  renderThermal();
  pollJob();
}

let currentStatus = null;
// 直近の /api/rag/status レスポンス (ヘッダのモデル選択で RAG がロード済みかを見る)
let ragStatus = null;
</script>

<script>
// ------------------------------------------------------------- モデル切替 (パネル常設の一覧)
let selectedProfile = null;

// ヘッダのプルダウンは稼働中モデルへ自動追随する。ユーザーがプルダウン / 一覧クリックで選んだときは
// HDR_MANUAL_MS の間だけ追随を止め、切替操作の対象を維持する (2026-10-26)
const HDR_MANUAL_MS = 10000;
let hdrManualUntil = 0;

function markHdrManual() {
  hdrManualUntil = Date.now() + HDR_MANUAL_MS;
}

// 自動追随: 手動選択の猶予を過ぎたら selectedProfile を稼働中モデル (無ければ未選択) へ戻す。
// 毎ポーリング (2秒) の renderModelList() から呼ぶので、猶予経過の実効遅れは最大 2 秒。
function syncHdrModelSelection() {
  if (Date.now() < hdrManualUntil) return;
  selectedProfile = currentStatus && currentStatus.active ? currentStatus.active.profile : null;
}

function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

// 1 件のコンテナ情報を .model-item 要素にする (モーダル一覧とパネル常設一覧で共通)
function makeModelItem(c, st, sw) {
  const isCurrent = st.active && st.active.profile === c.profile;
  const isTarget = sw && sw.profile === c.profile;
  let cls = "", meta;
  if (isTarget) {
    // 切替対象 B: API応答(sw.ready)=現在稼働中(緑)。Magnitude はコンテナを立たせないため
    // running は常に false → sw.ready を優先して稼働判定する
    if (sw.ready) { cls = "current"; meta = "現在稼働中"; }
    else if (!c.running) meta = "停止中";
    else { cls = "switching"; meta = "切替中…"; }
  } else if (isCurrent) {
    cls = "current";
    meta = "現在稼働中";
  } else if (c.running && sw) {
    // 停止処理中の旧モデル A
    cls = "stopping";
    meta = "停止中…";
  } else {
    meta = (c.running ? "稼働中" : "停止中") + (c.uptime_str ? " (" + c.uptime_str + ")" : "");
  }
  // modelctl (WSL): 重み未導入のモードは切替不可 (bridge が DL を走らせない)
  const notReady = c.ready === false;
  if (notReady && !isTarget) meta = (meta ? meta + "・" : "") + "重み未導入";
  const div = document.createElement("div");
  div.className = "model-item" + (cls ? " " + cls : "") + (notReady ? " not-ready" : "") +
    (c.profile === selectedProfile ? " selected" : "");
  div.innerHTML = `<span class="name">${c.profile}</span><span class="meta">${meta}</span>`;
  div.onclick = () => {
    if (notReady) return;
    selectedProfile = c.profile;
    markHdrManual();
    renderModelList();
  };
  return div;
}

// パネル常設の「切り替え実行」ボタン: ジョブ実行中 / 未選択 / すでに稼働中のモデル は不可
function updateSwitchButtons(st) {
  const btn = document.getElementById("panel-switch-go");
  if (!btn) return;
  const busy = !!(st && st.switching);
  const active = st && st.active ? st.active.profile : null;
  // modelctl (WSL): 重み未導入モードは切替対象にできない (compose 側は ready 未定義で常時 true)
  const sel = st && st.containers ? st.containers.find((c) => c.profile === selectedProfile) : null;
  const blocked = !!sel && sel.ready === false;
  // ヘッダのプルダウンで RAG を選んだときはパネルの「切り替え実行」の対象外 (RAG は起動/停止)
  const isRag = selectedProfile === RAG_VALUE;
  btn.disabled = busy || !selectedProfile || isRag || selectedProfile === active || blocked;
  btn.textContent = selectedProfile && !isRag ? "切り替え実行: " + selectedProfile : "切り替え実行";
  renderHdrSwitchBtn();
}

function renderModelList() {
  syncHdrModelSelection();
  const st = currentStatus || { containers: [], active: null };
  // 排他環境: RAG embedding 稼働中に LLM へ切替すると embedding が停止される警告
  const on = !!st.rag_running;
  const warn = document.getElementById("panel-switch-warn");
  // "" ではなく "block": #panel-switch-warn は ID セレクタで display:none のため、
  // inline を空にすると CSS の none が残り表示されない
  warn.style.display = on ? "block" : "none";
  warn.textContent = on
    ? "注意: 稼働中の RAG embedding を停止して切り替えます (VRAM 排他)"
    : "";
  // 切替ジョブ実行中なら kind=switch の情報のみ状態表示に使う
  const sw = st.switching && st.switching.kind === "switch" ? st.switching : null;
  const list = document.getElementById("panel-model-list");
  list.innerHTML = "";
  for (const c of st.containers) list.appendChild(makeModelItem(c, st, sw));
  updateSwitchButtons(st);
  renderHdrModel();
}

// モデル切替を実行する (一覧はパネル常設。モデル切替モーダルは廃止)。
// パネルの「切り替え実行」とヘッダ行の「切替」ボタンから呼ぶ
async function runSwitch() {
  if (!selectedProfile || selectedProfile === RAG_VALUE) return;
  // 切替実行から HDR_MANUAL_MS は自動追随を止める。ジョブが 10 秒を超えると猶予が切れ、旧稼働中へ
  // 選択が戻って「切り替え実行」が稼働中と同モデル扱いで disabled になるが、その間は poll が
  // switching 中なのでボタンは不可のまま (状態はヘッダラベル「切替中…」で分かる)
  markHdrManual();
  const btn = document.getElementById("panel-switch-go");
  btn.disabled = true;
  // ヘッダ行の切替ボタンから押されたときも、ジョブ状態が poll に現れるまで連打を塞ぐ
  const hdrBtn = document.getElementById("hdr-switch-btn");
  hdrBtn.disabled = true;
  // poll (2秒間隔) を待たず、押した瞬間に進行中ラベルへ変える (以降は renderHdrSwitchBtn が維持)
  hdrBtn.textContent = HDR_JOB_LABELS.switch;
  const logEl = document.getElementById("panel-switch-log");
  logEl.style.display = "block";
  logEl.textContent = `切り替え開始: ${selectedProfile} ...\n`;
  try {
    const r = await fetch(API + "/api/vllm/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: selectedProfile }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      logEl.textContent += "エラー: " + (err.detail || r.status) + "\n";
      btn.disabled = false;
      return;
    }
    logEl.textContent += "バックグラウンド実行中。進捗は自動更新されます。\n";
  } catch (e) {
    logEl.textContent += "リクエスト失敗: " + e + "\n";
    btn.disabled = false;
  }
}

document.getElementById("panel-switch-go").onclick = runSwitch;

// ------------------------------------------------- ヘッダ行のモデル選択プルダウンと切替ボタン
// LLM 一覧 + RAG (リスト上は一番下) を並べ、選択値 selectedProfile はパネル常設一覧と共有する。
// 選択中がロード済 (現在稼働中) のモデルなら、切替ボタンは停止ボタンになる。
const RAG_VALUE = "__rag__";

function hdrModelOptions() {
  const st = currentStatus;
  const opts = [];
  for (const c of (st && st.containers ? st.containers : [])) {
    let suffix = "";
    if (c.ready === false) suffix = " (重み未導入)";
    else if (st.active && st.active.profile === c.profile) suffix = " (稼働中)";
    opts.push([c.profile, c.profile + suffix]);
  }
  // RAG 環境が無いプラットフォーム (WSL) は RAG を選択肢に出さない
  if (PLAT.rag_enabled !== false) {
    opts.push([RAG_VALUE, "RAG (sociax-rag)" + (ragStatus && ragStatus.running ? " (稼働中)" : "")]);
  }
  return opts;
}

function renderHdrModel() {
  const sel = document.getElementById("hdr-model-select");
  if (!sel) return;
  sel.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = "";
  ph.textContent = "モデルを選択";
  sel.appendChild(ph);
  for (const [v, t] of hdrModelOptions()) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = t;
    sel.appendChild(o);
  }
  sel.value = selectedProfile || "";
  renderHdrSwitchBtn();
}

// ジョブ進行中はヘッダボタンラベルで状態を示す (ヘッダからの切替でタブを遷移させないため)。
// 省略記号は付けず最大 4 文字に揃える (ボタン幅 = 最長ラベル「再作成中」+ padding で決める)
const HDR_JOB_LABELS = { switch: "切替中", stop: "停止中", recreate: "再作成中" };

function renderHdrSwitchBtn() {
  const btn = document.getElementById("hdr-switch-btn");
  if (!btn) return;
  const st = currentStatus;
  const busy = !!(st && st.switching);
  const active = st && st.active ? st.active.profile : null;
  const cont = st && st.containers ? st.containers.find((c) => c.profile === selectedProfile) : null;
  let mode = "switch", label = "切替", dis = true;
  if (selectedProfile === RAG_VALUE) {
    // RAG はロード済み=稼働中。稼働中なら停止ボタン、停止中なら起動ボタン
    if (ragStatus && ragStatus.running) { mode = "stop"; label = "停止"; }
    else label = "起動";
    dis = busy;
  } else if (selectedProfile && selectedProfile === active) {
    mode = "stop"; label = "停止"; dis = busy;
  } else if (selectedProfile) {
    dis = busy || !cont || cont.ready === false;
  }
  if (busy) label = HDR_JOB_LABELS[st.switching.kind] || "実行中";
  btn.textContent = label;
  btn.disabled = dis;
  btn.classList.toggle("stop", mode === "stop");
}

document.getElementById("hdr-model-select").onchange = (e) => {
  selectedProfile = e.target.value || null;
  markHdrManual();
  renderModelList();
};

document.getElementById("hdr-switch-btn").onclick = () => {
  if (selectedProfile === RAG_VALUE) {
    openRagModal(ragStatus && ragStatus.running ? "stop" : "start");
    return;
  }
  const active = currentStatus && currentStatus.active ? currentStatus.active.profile : null;
  if (selectedProfile && selectedProfile === active) { openStopModal(); return; }
  if (!selectedProfile) return;
  // 表示中のタブは維持したまま切替を実行する (進捗ログはモデルタブのパネルに出る)
  runSwitch();
};
</script>

<script>

<script>
// ------------------------------------------------------------- RAG (sociax-rag) 起動/停止
let ragAction = null; // "start" | "stop"
let ragJobStarted = false; // ユーザーが実際にジョブを開始したか（確認ダイアログ誤閉じ防止）

function renderRag(st) {
  const job = st.switching;
  const emb = st.services.embedding;
  const qdr = st.services.qdrant;
  const setR = (id, text, cls) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "v" + (cls ? " " + cls : "");
  };
  const stateOf = (s) => {
    if (!s.running) return ["停止中", "down"];
    if (s.health) return ["稼働中 (API応答)", "up"];
    return ["起動中… (API応答なし)", "hot"];
  };
  const [eText0, eCls0] = stateOf(emb);
  // 排他環境: LLM 稼働中による embedding 停止は「LLM 排他で停止」と表示
  const eText = st.blocked_by_llm && !emb.running ? "停止中 (LLM 排他)" : eText0;
  const eCls = st.blocked_by_llm && !emb.running ? "down" : eCls0;
  const [qText, qCls] = stateOf(qdr);
  setR("r-emb", eText, eCls);
  setR("r-qdr", qText, qCls);
  setR("r-uptime", emb.uptime_str || qdr.uptime_str || "-");
  // 起動: 排他環境 (atom2) は Qdrant 常時稼働のため embedding 基準 / それ以外は従来どおりいずれか稼働で不可
  const startBlocked = PLAT.exclusive_llm_rag
    ? emb.running && qdr.running
    : st.running;
  document.getElementById("btn-rag-start").disabled = !!job || startBlocked;
  document.getElementById("btn-rag-stop").disabled = !!job || !st.running;
}

function openRagModal(action) {
  ragAction = action;
  ragJobStarted = false;
  const logEl = document.getElementById("rag-log");
  logEl.textContent = "";
  logEl.style.display = "none";
  document.getElementById("rag-modal-title").textContent =
    action === "start" ? "RAG 起動" : "RAG 停止";
  document.getElementById("rag-msg").textContent =
    action === "start"
      ? (PLAT.exclusive_llm_rag
          ? "RAG環境 (embedding + qdrant) を起動しますか?\n稼働中の LLM は自動停止されます (VRAM 排他)。"
          : "RAG環境 (embedding + qdrant) を起動しますか?")
      : "RAG環境 (embedding + qdrant) を停止しますか?";
  document.getElementById("rag-cancel").style.display = "";
  document.getElementById("rag-go").textContent = action === "start" ? "起動する" : "停止する";
  document.getElementById("rag-go").disabled = false;
  openModal("modal-rag");
}

document.getElementById("btn-rag-start").onclick = () => openRagModal("start");
document.getElementById("btn-rag-stop").onclick = () => openRagModal("stop");

document.getElementById("rag-cancel").onclick = () => closeModal("modal-rag");

document.getElementById("rag-go").onclick = async () => {
  if (!ragAction) return;
  const btn = document.getElementById("rag-go");
  const logEl = document.getElementById("rag-log");
  let failed = false;
  btn.disabled = true;
  document.getElementById("rag-cancel").style.display = "none";
  document.getElementById("rag-msg").textContent = "実行中です… (完了するとこのダイアログは自動で閉じます)";
  try {
    const r = await fetch(API + "/api/rag/" + ragAction, { method: "POST" });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      document.getElementById("rag-msg").textContent = "";
      logEl.style.display = "block";
      logEl.textContent = "エラー: " + (err.detail || r.status) + "\n";
      failed = true;
    } else {
      logEl.style.display = "block";
      ragJobStarted = true;
    }
  } catch (e) {
    document.getElementById("rag-msg").textContent = "";
    logEl.style.display = "block";
    logEl.textContent = "リクエスト失敗: " + e + "\n";
    failed = true;
  }
  if (failed) {
    btn.disabled = false;
    document.getElementById("rag-cancel").style.display = "";
  }
};
</script>

<script>
// ------------------------------------------------------------- 実行ログモーダル
let logProfile = null;
let logLines = [];
let logSearchTerm = "";

document.getElementById("btn-log").onclick = () => {
  const a = currentStatus && currentStatus.active;
  if (!a) return;
  logProfile = a.profile;
  logSearchTerm = "";
  logLines = [];
  const input = document.getElementById("log-search-input");
  input.value = "";
  input.classList.add("hidden");
  document.getElementById("log-title").textContent =
    a.profile + "の実行ログ";
  loadLog();
  openModal("modal-log");
};

async function loadLog() {
  if (!logProfile) return;
  const el = document.getElementById("log-content");
  el.textContent = "読み込み中...";
  try {
    const r = await fetchJson(
      API + "/api/vllm/log?profile=" + encodeURIComponent(logProfile)
    );
    logLines = r.logs || [];
    renderLog();
  } catch (e) {
    el.textContent = "ログ取得失敗: " + e;
  }
}

function renderLog() {
  const el = document.getElementById("log-content");
  let lines = logLines;
  if (logSearchTerm) {
    lines = logLines.filter((l) => l.toLowerCase().includes(logSearchTerm));
  }
  el.textContent = lines.length ? lines.join("\n") : "(該当するログがありません)";
  el.scrollTop = el.scrollHeight; // 初期表示・更新後は末尾までスクロール
}

document.getElementById("log-refresh").onclick = () => loadLog();
document.getElementById("log-close").onclick = () => closeModal("modal-log");

document.getElementById("log-search").onclick = () => {
  const input = document.getElementById("log-search-input");
  input.classList.toggle("hidden");
  if (!input.classList.contains("hidden")) input.focus();
};

document.getElementById("log-search-input").oninput = (e) => {
  logSearchTerm = e.target.value.trim().toLowerCase();
  renderLog();
};

document.getElementById("log-download").onclick = () => {
  const text = logLines.join("\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (logProfile || "model") + ".log";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>

<script>
// ------------------------------------------------------------- パラメータモーダル
let paramsProfile = null;

document.getElementById("btn-params").onclick = async () => {
  const st = currentStatus;
  if (!st || !st.active) {
    alert("稼働中のモデルがありません");
    return;
  }
  paramsProfile = st.active.profile;
  document.getElementById("params-title").textContent =
    "パラメータ表示・編集 (" + paramsProfile + ")";
  const body = document.getElementById("params-body");
  body.innerHTML = "<tr><td colspan='2' class='meta'>読み込み中...</td></tr>";
  document.getElementById("recreate-log").style.display = "none";
  openModal("modal-params");
  try {
    const p = await fetchJson(API + "/api/vllm/params?profile=" + encodeURIComponent(paramsProfile));
    body.innerHTML = "";
    for (const row of p.params) {
      const tr = document.createElement("tr");
      const tdFlag = document.createElement("td");
      tdFlag.textContent = row.flag;
      const tdVal = document.createElement("td");
      const inp = document.createElement("input");
      inp.value = row.value ?? "";
      inp.readOnly = !row.editable;
      inp.dataset.flag = row.flag;
      tdVal.appendChild(inp);
      tr.appendChild(tdFlag);
      tr.appendChild(tdVal);
      body.appendChild(tr);
    }
  } catch (e) {
    body.innerHTML = "<tr><td colspan='2'>読み込み失敗: " + e + "</td></tr>";
  }
};

document.getElementById("params-close").onclick = () => closeModal("modal-params");

document.getElementById("params-save").onclick = async () => {
  const inputs = Array.from(document.querySelectorAll("#params-body input"))
    .filter((i) => !i.readOnly);
  const p = await fetchJson(API + "/api/vllm/params?profile=" + encodeURIComponent(paramsProfile));
  const updates = {};
  for (const inp of inputs) {
    const cur = (p.params.find((x) => x.flag === inp.dataset.flag) || {}).value;
    if (inp.value !== (cur ?? "")) updates[inp.dataset.flag] = inp.value;
  }
  if (!Object.keys(updates).length) {
    alert("変更がありません");
    return;
  }
  if (!confirm("変更内容でコンテナを再作成しますか?\n" +
    Object.entries(updates).map(([k, v]) => k + " = " + v).join("\n"))) return;

  const btn = document.getElementById("params-save");
  btn.disabled = true;
  const logEl = document.getElementById("recreate-log");
  logEl.style.display = "block";
  logEl.textContent = "compose 更新 + コンテナ再作成を開始...\n";
  try {
    const r = await fetch(API + "/api/vllm/params", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: paramsProfile, updates }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      logEl.textContent += "エラー: " + (err.detail || r.status) + "\n";
      btn.disabled = false;
      return;
    }
    logEl.textContent += "再作成中。進捗は自動更新されます。\n";
  } catch (e) {
    logEl.textContent += "リクエスト失敗: " + e + "\n";
    btn.disabled = false;
  }
};

// ------------------------------------------------------------- Cline設定値モーダル
let clineData = null;

document.getElementById("btn-cline").onclick = async () => {
  const a = currentStatus && currentStatus.active;
  if (!a) return;
  const content = document.getElementById("cline-content");
  content.innerHTML = "<div class='cline-loading'>読み込み中...</div>";
  openModal("modal-cline");
  try {
    clineData = await fetchJson(API + "/api/vllm/cline");
    renderCline();
  } catch (e) {
    clineData = null;
    content.innerHTML = "<div class='cline-error'>取得失敗: " + e + "</div>";
  }
};

function renderCline() {
  const d = clineData;
  const content = document.getElementById("cline-content");
  content.innerHTML = "";
  const sections = [
    {
      title: "API Configuration",
      rows: [
        ["API Provider", d.api_provider],
        ["Base URL", d.base_url],
        ["OpenAI Compatible API Key", d.api_key],
        ["ModelID", d.model_id],
      ],
    },
    {
      title: "MODEL CONFIGURATION",
      rows: [
        ["Supports Images", d.supports_images ? "On" : "Off"],
        ["Context Windows Size", [
          { text: d.context_recommended + " (推奨)", copy: String(d.context_recommended) },
          { text: d.context_max + " (最大)", copy: String(d.context_max) },
        ]],
        ["Max Output Tokens", [
          { text: d.max_output_recommended + " (推奨)", copy: String(d.max_output_recommended) },
          { text: d.max_output_max + " (最大)", copy: String(d.max_output_max) },
        ]],
        ["Temperature", String(d.temperature)],
        ["Reasoning Effort", d.reasoning_effort_options.map((o) => ({ text: o, copy: o }))],
      ],
    },
  ];
  for (const sec of sections) {
    const secDiv = document.createElement("div");
    secDiv.className = "cline-section";
    const title = document.createElement("div");
    title.className = "cline-section-title";
    title.textContent = sec.title;
    secDiv.appendChild(title);
    for (const [label, value] of sec.rows) {
      const row = document.createElement("div");
      row.className = "cline-row";
      const labelEl = document.createElement("span");
      labelEl.className = "cline-label";
      labelEl.textContent = label;
      const valueEl = document.createElement("span");
      valueEl.className = "cline-value";
      // 値を「パーツ」のリストに正規化: 各パーツは個別にコピー可能
      const parts = Array.isArray(value) ? value : [{ text: value, copy: value }];
      parts.forEach((part, i) => {
        if (i > 0) {
          const sep = document.createElement("span");
          sep.className = "cline-sep";
          sep.textContent = "/";
          valueEl.appendChild(sep);
        }
        const partEl = document.createElement("span");
        partEl.className = "cline-part";
        partEl.textContent = part.text;
        const copyBtn = document.createElement("button");
        copyBtn.className = "cline-copy";
        copyBtn.textContent = "コピー";
        copyBtn.onclick = () => copyClineText(part.copy, copyBtn);
        valueEl.appendChild(partEl);
        valueEl.appendChild(copyBtn);
      });
      row.appendChild(labelEl);
      row.appendChild(valueEl);
      secDiv.appendChild(row);
    }
    content.appendChild(secDiv);
  }
}

function copyClineText(text, btn) {
  if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
  const restore = () => {
    btn.textContent = btn.dataset.orig;
    btn.classList.remove("copied");
  };
  const onSuccess = () => {
    btn.textContent = "コピー済み";
    btn.classList.add("copied");
    setTimeout(restore, 1500);
  };
  const onFail = () => {
    prompt("コピーできませんでした。テキストをコピーしてください:", text);
    restore();
  };
  if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
    // セキュリティコンテキスト(HTTPS/localhost): 最新 Clipboard API
    navigator.clipboard.writeText(text).then(onSuccess).catch(onFail);
  } else {
    // 非セキュリティコンテキスト(HTTP/LAN IP): legacy execCommand フォールバック
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "absolute";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy") ? onSuccess() : onFail();
    document.body.removeChild(ta);
  }
}

document.getElementById("cline-copy-all").onclick = () => {
  if (!clineData) return;
  const d = clineData;
  const text = [
    "API Configuration",
    "  API Provider: " + d.api_provider,
    "  Base URL: " + d.base_url,
    "  OpenAI Compatible API Key: " + d.api_key,
    "  ModelID: " + d.model_id,
    "MODEL CONFIGURATION",
    "  Supports Images: " + (d.supports_images ? "On" : "Off"),
    "  Context Windows Size: " + d.context_recommended + " (推奨) / " + d.context_max + " (最大)",
    "  Max Output Tokens: " + d.max_output_recommended + " (推奨) / " + d.max_output_max + " (最大)",
    "  Temperature: " + d.temperature,
    "  Reasoning Effort: " + d.reasoning_effort_options.join(" / "),
  ].join("\n");
  copyClineText(text, document.getElementById("cline-copy-all"));
};

document.getElementById("cline-close").onclick = () => closeModal("modal-cline");

// ------------------------------------------------------------- ジョブ進捗ポーリング
const JOB_LOG_IDS = {
  switch: ["panel-switch-log"],
  recreate: ["recreate-log"],
  stop: ["stop-log"],
};

// kind に対応する進捗ログ要素を配列で返す (モーダルとパネル常設の両方)
function jobLogEls(kind) {
  return (JOB_LOG_IDS[kind] || []).map((id) => document.getElementById(id)).filter(Boolean);
}

async function pollJob() {
  let job;
  try {
    job = await fetchJson(API + "/api/vllm/job");
  } catch (e) {
    job = null;
  }
  if (job) {
    if (!job.running) {
      // ジョブ終了(切替/再作成/停止): ログを非表示にし、ボタン復元 / モーダル閉じる
      if (job.kind) onJobDone(job);
    } else {
      // 空行を詰めて表示する(スクリプトの上書き表示用の空行が多い)
      const lines = (job.log_tail || []).filter((l) => l.trim()).join("\n");
      const text = `[${job.kind} ${job.profile}] ${job.elapsed_s}s 経過\n---\n${lines}\n`;
      for (const logEl of jobLogEls(job.kind)) {
        logEl.style.display = "block";
        logEl.textContent = text;
        logEl.scrollTop = logEl.scrollHeight;
      }
    }
  }
  // RAG ジョブ (vLLM ジョブと独立)
  let rjob;
  try {
    rjob = await fetchJson(API + "/api/rag/job");
  } catch (e) {
    return;
  }
  if (!rjob.running) {
    if (rjob.kind && ragJobStarted) onRagJobDone(rjob);
    return;
  }
  const rlogEl = document.getElementById("rag-log");
  rlogEl.style.display = "block";
  const rlines = (rjob.log_tail || []).filter((l) => l.trim()).join("\n");
  rlogEl.textContent = `[${rjob.kind}] ${rjob.elapsed_s}s 経過\n---\n${rlines}\n`;
  rlogEl.scrollTop = rlogEl.scrollHeight;
}

function onRagJobDone(job) {
  ragJobStarted = false;
  const logEl = document.getElementById("rag-log");
  if (logEl.style.display !== "none") logEl.style.display = "none";
  document.getElementById("rag-go").disabled = false;
  closeModal("modal-rag");
}

function onJobDone(job) {
  const isSwitch = job.kind === "switch";
  // 切替ログは完了後も表示を維持。再作成/停止のみ従来どおり非表示化
  if (!isSwitch) {
    for (const logEl of jobLogEls(job.kind)) {
      if (logEl.style.display !== "none") logEl.style.display = "none";
    }
  }
  if (isSwitch) {
    // パネル常設の進捗ログはジョブ完了で閉じる (結果は vLLM 行の状態表示に反映される)
    document.getElementById("panel-switch-log").style.display = "none";
    // パネル常設一覧の選択状態・実行ボタン可否を最新化する
    renderModelList();
  } else if (job.kind === "stop") {
    // 停止完了で確認ダイアログを自動閉じる
    closeModal("modal-stop");
  } else {
    document.getElementById("params-save").disabled = false;
  }
}

// ------------------------------------------------------------- P-State(タイトル右)
// P0=緑 / P2・P3・P5・P7・P8・P12・P15=黄 / それ以外=赤
//   P5・P7 は GeForce (WSL2 の RTX 5090) で頻出する中間状態。追加前は「それ以外」に
//   落ちて赤 (異常に見える) だった (実測: アイドルでも P8 と P5 が秒刻みで交互)。
//   GB10 / R9700 では P5・P7 は観測されないため既存環境の表示は実質不変。
function renderPstate(m) {
  const el = document.getElementById("pstate");
  if (!m.gpu_pstate) {
    el.textContent = "";
    return;
  }
  el.textContent = m.gpu_pstate;
  el.style.color =
    m.gpu_pstate === "P0"
      ? "var(--green)"
      : ["P2", "P3", "P5", "P7", "P8", "P12", "P15"].includes(m.gpu_pstate)
        ? "var(--yellow)"
        : "var(--red)";
}

// ------------------------------------------------------------- GPU サーマルガード表示
// /api/thermal から「発動中か」を引く。発動中はヘッダにインジケータを出し、
// 監視対象 (watchId) と制限対象 (limitId) のカード枠線を着色する。
//   atom2 (mode=power / R9700): 監視 = GPU 温度のみ、制限 = GPU 電力
//   atom1 (mode=clock  / GB10) : 監視 = CPU(acpitz)・GPU 温度の両方。thermal_guard.sh は
//       max(acpitz, GPU) を見るので temp_c (=max) を生んだセンサーが制限値に引っかかった
//       犯人 = その側のパネルだけ着色する (同値なら共有ダイの acpitz = CPU 側)。
//       制限 = GPU クロック
// 段は制限値そのもので判定 (power: cap_crit_w 以下で赤、clock: lock_crit_mhz 以下で赤)。
// 復帰 (上限=最大 / locked_mhz=0) は null = 灰色に戻る。
function thermalState() {
  const t = THERMAL;
  if (!t || !t.enabled) return null;
  if (t.mode === "power") {
    if (t.power_cap_w == null || t.power_max_w == null) return null;
    if (t.power_cap_w >= t.power_max_w) return null; // 300W (最大) は制限なし
    return {
      crit: t.cap_crit_w != null && t.power_cap_w <= t.cap_crit_w,
      watchId: "g-gpu-temp",
      limitId: "g-gpu-power",
      text: `電力制限 ${t.power_cap_w}W (GPU ${Math.round(t.temp_c ?? 0)}℃)`,
    };
  }
  if (!t.locked_mhz) return null; // 0 = nvidia-smi -rgc 解除
  // 監視対象が 2 つ (CPU/GPU 温度) なので、制限値に引っかかった = temp_c (=max) を生んだ方
  const a = Math.round(t.acpitz_c ?? 0);
  const g = Math.round(t.gpu_c ?? 0);
  const cpuSide = a >= g;
  return {
    crit: t.lock_crit_mhz != null && t.locked_mhz <= t.lock_crit_mhz,
    watchId: cpuSide ? "g-cpu-temp" : "g-gpu-temp",
    limitId: "g-gpu-clock",
    text: `クロック制限 ${t.locked_mhz}MHz (${cpuSide ? "CPU" : "GPU"} ${cpuSide ? a : g}℃)`,
  };
}

function renderThermal() {
  const st = thermalState();
  const el = document.getElementById("thermal");
  if (el) {
    el.textContent = st ? st.text : "";
    el.style.color = st ? (st.crit ? "var(--thr-red)" : "var(--thr-yellow)") : "";
  }
  for (const g of gages) {
    const c = g.cardEl;
    if (!c) continue;
    c.classList.remove("thr-crit", "thr-high");
    if (st && (g.def.id === st.watchId || g.def.id === st.limitId)) {
      c.classList.add(st.crit ? "thr-crit" : "thr-high");
    }
  }
}

// ------------------------------------------------------------- 起動
function applyPlatform() {
  // dgx-spark は固定ラベル「DGX Spark」、atom2 / wsl はホスト名 (例: WhitebearATOM2)
  const name = PLAT.platform === "dgx-spark" ? PLAT.label : (PLAT.hostname || PLAT.label);
  const h1 = document.getElementById("hdr-title");
  if (h1) h1.textContent = name;
  document.title = name + " Monitor";
  if (PLAT.exclusive_llm_rag) {
    const note = document.getElementById("rag-excl-note");
    if (note) note.style.display = "";
  }
  // RAG 環境が無いプラットフォーム (WSL) はセクションごと非表示 + poll も省略
  if (PLAT.rag_enabled === false) {
    const sec = document.getElementById("sec-rag");
    if (sec) sec.style.display = "none";
  }
  // modelctl (WSL) は docker を使わない → 「コンテナ」表記と再作成ボタンを外す
  if (PLAT.backend === "modelctl") {
    const h2 = document.getElementById("h2-model");
    if (h2) h2.textContent = "モデル (model-ctl.sh)";
    const ks = document.getElementById("k-status");
    if (ks) ks.textContent = "状態";
    const sw = document.getElementById("panel-switch-warn");
    if (sw) sw.textContent = "";
  }
  // パラメータ編集未対応 (WSL: 設定形式がエンジンごとに異なる) は保存ボタンを隠す
  if (PLAT.params_editable === false) {
    const save = document.getElementById("params-save");
    if (save) save.style.display = "none";
  }
}

(async () => {
  // プラットフォーム取得 (失敗時は既定 = DGX Spark/unified 挙動で継続)
  try {
    PLAT = Object.assign(PLAT, await fetchJson(API + "/api/platform"));
  } catch (e) {
    console.error("platform fetch failed", e);
  }
  applyPlatform();
  buildHostCards();
  buildMainChart();
  // ヘッダのモデル選択プルダウン (RAG はリスト最下部。rag_enabled=false なら RAG なし)
  renderHdrModel();
  // ページリロード後、サーバー側が保持する直近30分の履歴で時系列グラフをバックフィルする
  try {
    const hist = await fetchJson(API + "/api/history");
    for (const m of hist) pushPoint(m.timestamp, m);
  } catch (e) {
    console.error("history backfill failed", e);
  }
  refreshMainChart();
  poll();
  setInterval(poll, POLL_MS);
})();
