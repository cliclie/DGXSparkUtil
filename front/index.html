<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark Monitor</title>
<link rel="icon" href="static/meter-dgx.ico">
<script src="static/chart.umd.js"></script>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card2: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --purple: #bc8cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  position: sticky;
  top: 0;
  z-index: 5;
}
header h1 { font-size: 17px; margin: 0; }
header #clock { color: var(--muted); font-size: 13px; }
main { padding: 16px 20px 32px; }
section { margin-bottom: 22px; }
section > h2 {
  font-size: 14px;
  color: var(--muted);
  border-left: 3px solid var(--blue);
  padding-left: 8px;
  margin: 0 0 10px;
}
/* ---- Tier 1 (半円ゲージ) ---- */
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.gauge {
  flex: 0 0 218px; /* 固定幅: 6枚/行 × 218px + gap5 × 10px = 1358px (main内側1360pxに収まる) */
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px 8px;
  text-align: center;
}
.gauge .gtitle { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.gauge .gtitle .gdot { display: inline-block; width: 12px; height: 12px; margin-right: 6px; }
.gauge .gcanvas { position: relative; height: 96px; }
.gauge .gcanvas canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.gauge .gval {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  font-weight: 600;
  pointer-events: none;
}
.gauge .gval .unit { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.gauge .gsub { color: var(--muted); font-size: 11px; margin-top: 4px; min-height: 14px; }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.hot { color: var(--red); }
.v.down { color: var(--muted); } /* vLLM 行の「停止中」は灰色 */
.v.stale { color: var(--muted); } /* スループット: 前回値を保持中(held)は灰色 */
/* ---- Tier 2 ---- */
.charts-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.charts-head h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; }
.range-btns { display: flex; gap: 6px; }
.range-btns button { padding: 4px 12px; font-size: 12px; border-radius: 14px; }
.range-btns button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px 6px;
}
.chart-card .cwrap { position: relative; height: 360px; }
/* ---- Tier 3 ---- */
#vllm-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
#vllm-headline { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 8px; }
#vllm-headline .item .k { color: var(--muted); font-size: 11px; display: block; }
#vllm-headline .item .v { font-size: 15px; font-weight: 600; }
#v-model { display: block; min-width: 10ch; }
#v-port { display: block; min-width: 5ch; text-align: center; }
#v-status { display: block; min-width: 18ch; text-align: left; }
#v-uptime { display: block; min-width: 7ch; text-align: center; }
#v-rw { display: block; min-width: 7ch; text-align: right; }
#v-kv { display: block; min-width: 7ch; text-align: right; }
#v-e2e { display: block; min-width: 7ch; text-align: right; }
#v-ttft { display: block; min-width: 6ch; text-align: right; }
#v-tps-in, #v-tps-out { display: block; min-width: 12ch; text-align: right; }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 11px;
  border: 1px solid var(--border);
}
.badge.up { color: var(--green); border-color: var(--green); }
.badge.down { color: var(--red); border-color: var(--red); }
.btns { margin-top: 10px; display: flex; gap: 10px; }
button {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
}
button:hover { border-color: var(--blue); }
button.primary { background: #1f6feb; border-color: #1f6feb; }
#btn-stop { background: #33161a; border-color: #5c2b30; color: #e5534b; }
#btn-stop:hover { border-color: var(--red); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* ---- モーダル ---- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.modal.hidden { display: none; }
.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: min(680px, 92vw);
  max-height: 84vh;
  overflow: auto;
  padding: 18px 20px;
}
.modal-box h3 { margin: 0 0 12px; font-size: 15px; }
.model-list { display: flex; flex-wrap: wrap; gap: 8px; }
.model-item {
  width: fit-content;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.model-item.selected { border-color: var(--blue); background: rgba(88,166,255,.08); }
.model-item .name { font-weight: 600; }
.model-item .meta { color: var(--muted); font-size: 12px; }
.model-item.current .meta { color: var(--green); }
.model-item.stopping .meta,
.model-item.switching .meta { color: var(--red); }
.job-log {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: Consolas, monospace;
  font-size: 11px;
  white-space: pre;
  max-height: 220px;
  overflow-x: hidden; /* 横スクロールバーを出さず、オーバーフロー分を非表示(折り返しなし) */
  overflow-y: auto;
  margin-top: 12px;
  display: none;
}
.job-log:empty::before { content: "ログ"; color: var(--muted); } /* 内容なし時のプレースホルダー */
#switch-log {
  display: block; /* 切替ログは常時表示(7行固定) */
  line-height: 14px;
  height: 116px; /* 7行 × 14px + padding 16px + border 2px = 116px (border-box) */
}
table.params { width: 100%; border-collapse: collapse; font-size: 13px; }
table.params th, table.params td {
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
}
table.params th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.params td input {
  width: 160px;
  background: #010409;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: Consolas, monospace;
}
table.params td input[readonly] { color: var(--muted); }
.modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 10px; }
/* ---- モデル実行ログモーダル (三段構成) ---- */
.log-box {
  display: flex;
  flex-direction: column;
  width: 100vw;
  max-height: 84vh;
  overflow: hidden;
  padding: 16px 18px;
}
.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-bottom: 10px;
}
.log-head h3 { margin: 0; }
.log-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.log-search-input {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  width: 220px;
}
.log-search-input.hidden { display: none; }
.log-content {
  flex: 1 1 auto;
  min-height: 180px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: hidden;
  overflow-y: auto;
  color: var(--text);
}
</style>
</head>
<body>
<header>
  <h1>DGX Spark Monitor</h1>
  <span id="clock"></span>
</header>
<main>
  <!-- Tier 1: 現在値カード -->
  <section>
    <h2>現在値 (ホスト)</h2>
    <div class="grid" id="host-cards"></div>
  </section>

  <!-- Tier 2: 時系列グラフ -->
  <section>
    <h2>時系列 (全項目・2秒間隔)</h2>
    <div class="charts-head">
      <h3>CPU / メモリ / GPU / ストレージ (全項目 100% 換算)</h3>
      <div class="range-btns" id="range-btns">
        <button data-range="30m">直近30分</button>
        <button data-range="3h">直近3時間</button>
        <button data-range="all" class="active">すべて</button>
      </div>
    </div>
    <div class="chart-card">
      <div class="cwrap"><canvas id="ch-main"></canvas></div>
    </div>
  </section>

  <!-- Tier 3: vLLM -->
  <section>
    <h2>vLLM / モデル</h2>
    <div id="vllm-panel">
      <div id="vllm-headline">
        <div class="item"><span class="k">稼働モデル</span><span class="v" id="v-model">-</span></div>
        <div class="item"><span class="k">ポート</span><span class="v" id="v-port">-</span></div>
        <div class="item"><span class="k">コンテナ状態</span><span class="v" id="v-status">-</span></div>
        <div class="item"><span class="k">稼働時間</span><span class="v" id="v-uptime">-</span></div>
        <div class="item"><span class="k">実行/待機</span><span class="v" id="v-rw">-</span></div>
        <div class="item"><span class="k">KVCache</span><span class="v" id="v-kv">-</span></div>
        <div class="item"><span class="k">E2E</span><span class="v" id="v-e2e">-</span></div>
        <div class="item"><span class="k">TTFT</span><span class="v" id="v-ttft">-</span></div>
        <div class="item"><span class="k">入力スループット</span><span class="v" id="v-tps-in">-</span></div>
        <div class="item"><span class="k">出力スループット</span><span class="v" id="v-tps-out">-</span></div>
      </div>
      <div class="btns">
        <button class="primary" id="btn-switch">モデル切替</button>
        <button id="btn-log">ログ</button>
        <button id="btn-params">パラメータ表示・編集</button>
        <button id="btn-stop" disabled>停止</button>
      </div>
    </div>
  </section>
</main>

<!-- モーダル: モデル切替 -->
<div class="modal hidden" id="modal-switch">
  <div class="modal-box">
    <h3>モデル切替</h3>
    <div class="model-list" id="model-list"></div>
    <div class="job-log" id="switch-log"></div>
    <div class="modal-actions">
      <button id="switch-close">閉じる</button>
      <button class="primary" id="switch-go">切り替え実行</button>
    </div>
  </div>
</div>

<!-- モーダル: パラメータ表示・編集 -->
<div class="modal hidden" id="modal-params">
  <div class="modal-box">
    <h3 id="params-title">パラメータ表示・編集</h3>
    <table class="params">
      <thead><tr><th>引数</th><th>値</th></tr></thead>
      <tbody id="params-body"></tbody>
    </table>
    <div class="job-log" id="recreate-log"></div>
    <div class="modal-actions">
      <button id="params-close">閉じる</button>
      <button class="primary" id="params-save">保存してコンテナを再作成</button>
    </div>
  </div>
</div>

<!-- モーダル: モデル停止 -->
<div class="modal hidden" id="modal-stop">
  <div class="modal-box">
    <h3>モデル停止</h3>
    <p id="stop-msg"></p>
    <div class="job-log" id="stop-log"></div>
    <div class="modal-actions">
      <button id="stop-cancel">キャンセル</button>
      <button class="primary" id="stop-go">停止する</button>
    </div>
  </div>
</div>

<!-- モーダル: モデル実行ログ (三段構成) -->
<div class="modal hidden" id="modal-log">
  <div class="modal-box log-box">
    <!-- 一段目: タイトル(左) / 検索・再読み込み・ダウンロード(右) -->
    <div class="log-head">
      <h3 id="log-title">実行ログ</h3>
      <div class="log-head-actions">
        <input id="log-search-input" type="text" placeholder="検索キーワード" class="log-search-input hidden">
        <button id="log-search">検索</button>
        <button id="log-refresh">再読み込み</button>
        <button id="log-download">ダウンロード</button>
      </div>
    </div>
    <!-- 二段目: ログ表示 (縦スクロール / 横折り返し / 初期表示は末尾) -->
    <div class="log-content" id="log-content"></div>
    <!-- 三段目: 閉じる (右) -->
    <div class="modal-actions">
      <button id="log-close">閉じる</button>
    </div>
  </div>
</div>

<script>
"use strict";

const API = "";  // 同一オリジン (FastAPI が front/ を配信)
const MAX_POINTS = 4500;   // 3時間 / 2秒
const POLL_MS = 2000;
const RANGE_SECS = { "30m": 1800, "3h": 10800, all: Infinity };

Chart.defaults.color = "#8b949e";
Chart.defaults.borderColor = "rgba(48,54,61,.6)";
Chart.defaults.font.family = '"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif';

// ------------------------------------------------------------- 時系列データ
const series = {
  ts: [],
  labels: [],
  cpuLoad: [], cpuTemp: [],
  memUsed: [],
  gpuLoad: [], gpuTemp: [], gpuPower: [], gpuClock: [],
  diskUsed: [],
  diskRead: [], diskWrite: [],
};

function pushPoint(ts, m) {
  series.ts.push(ts);
  series.labels.push(new Date(ts * 1000).toLocaleTimeString("ja-JP", { hour12: false }));
  series.cpuLoad.push(m.cpu_load_pct);
  series.cpuTemp.push(m.cpu_temp_c);
  series.memUsed.push(m.mem_used_pct);
  series.gpuLoad.push(m.gpu_load_pct);
  series.gpuTemp.push(m.gpu_temp_c);
  series.gpuPower.push(m.gpu_power_w);
  series.gpuClock.push(m.gpu_clock_mhz);
  series.diskUsed.push(m.disk_used_pct);
  series.diskRead.push(m.disk_read_mbps);
  series.diskWrite.push(m.disk_write_mbps);
  if (series.ts.length > MAX_POINTS) {
    for (const k of Object.keys(series)) series[k].shift();
  }
}

// 範囲切替用のフィルタ (ts 基準で先頭を切る)
let rangeKey = "all";
function rangeStartIdx() {
  if (rangeKey === "all" || !series.ts.length) return 0;
  const cutoff = series.ts[series.ts.length - 1] - RANGE_SECS[rangeKey];
  for (let i = 0; i < series.ts.length; i++) {
    if (series.ts[i] >= cutoff) return i;
  }
  return series.ts.length - 1;
}

function viewArrays() {
  const i = rangeStartIdx();
  const n = series.ts.length;
  const sl = (a) => (i === 0 ? a : a.slice(i, n));
  return {
    labels: sl(series.labels),
    cpuLoad: sl(series.cpuLoad), cpuTemp: sl(series.cpuTemp),
    memUsed: sl(series.memUsed),
    gpuLoad: sl(series.gpuLoad), gpuTemp: sl(series.gpuTemp), gpuPower: sl(series.gpuPower),
    gpuClock: sl(series.gpuClock),
    diskUsed: sl(series.diskUsed),
    diskRead: sl(series.diskRead), diskWrite: sl(series.diskWrite),
  };
}

// ------------------------------------------------------------- 半円ゲージ
const ZONE_GREEN = "#3fb950";
const ZONE_ORANGE = "#d29922";
const ZONE_RED = "#f85149";
const ARC_BG = "rgba(48,54,61,.55)";
// README 仕様のゾーン閾値: 緑 < 60%、オレンジ 60〜85%、赤 > 85%
const ZONE_STOPS = [0.6, 0.85];

function fmtGiB(gib) {
  if (gib >= 1024) return (gib / 1024).toFixed(2) + " TiB";
  return Math.round(gib) + " GiB";
}

class Gauge {
  constructor(id, def) {
    this.def = def;
    this.ctx = document.getElementById(id).getContext("2d");
    const wrap = document.getElementById(id).parentElement; // .gcanvas
    const card = wrap.parentElement; // .gauge
    this.valEl = document.createElement("div");
    this.valEl.className = "gval";
    wrap.appendChild(this.valEl);
    this.subEl = card.querySelector(".gsub");
    this._last = null;
  }
  set(v, m) {
    if (v === this._last) return;
    this._last = v;
    this.render(v);
    this.valEl.innerHTML =
      (v == null ? "-" : this.def.fmt(v)) +
      (this.def.unit ? `<span class="unit">${this.def.unit}</span>` : "");
    this.subEl.textContent = this.def.sub ? this.def.sub(m) : "";
  }
  render(v) {
    const cv = this.ctx.canvas;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (w === 0 || h === 0) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    const ctx = this.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2;
    const cy = h - 2;
    const R = Math.min(w / 2, h) - 6;   // ゾーン帯の外半径 (コンテナ内に収まる)
    const lw = Math.max(8, R * 0.16);   // 値アーチの厚み
    const r = R - lw / 2 - 4;           // 値アーチの半径
    // 背景アーチ
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI);
    ctx.strokeStyle = ARC_BG;
    ctx.lineWidth = lw;
    ctx.stroke();
    if (v == null) return;
    const frac = Math.max(0, Math.min(1, v / this.def.max));
    // ゾーン色 (緑→橙→赤)。閾値は def.zoneStops でゲージ単位に上書き可能
    const stops = this.def.zoneStops || ZONE_STOPS;
    let color = ZONE_GREEN;
    if (frac > stops[1]) color = ZONE_RED;
    else if (frac > stops[0]) color = ZONE_ORANGE;
    // 色ゾーン帯 (細い外側リング)
    const zr = R - 1.5;
    ctx.lineWidth = 3;
    ctx.strokeStyle = ZONE_GREEN;
    ctx.beginPath(); ctx.arc(cx, cy, zr, Math.PI, Math.PI * (1 + stops[0])); ctx.stroke();
    ctx.strokeStyle = ZONE_ORANGE;
    ctx.beginPath(); ctx.arc(cx, cy, zr, Math.PI * (1 + stops[0]), Math.PI * (1 + stops[1])); ctx.stroke();
    ctx.strokeStyle = ZONE_RED;
    ctx.beginPath(); ctx.arc(cx, cy, zr, Math.PI * (1 + stops[1]), 2 * Math.PI); ctx.stroke();
    // 値アーチ
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, Math.PI * (1 + frac));
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

const GAUGE_DEFS = [
  { id: "g-cpu-load", title: "CPU 負荷", max: 100, unit: "%", color: "#58a6ff",
    dotBg: "rgba(88,166,255,.10)", // ■=2段目グラフの凡例ボックスと同一スタイル(塗り+枠)
    get: (m) => m.cpu_load_pct, fmt: (v) => v.toFixed(1), sub: (m) => (m.cpu_cores ? m.cpu_cores + " cores" : "") },
  { id: "g-cpu-temp", title: "CPU 温度", max: 100, unit: "°C", color: "#f85149",
    get: (m) => m.cpu_temp_c, fmt: (v) => v.toFixed(0), sub: () => "上限 100°C" },
  { id: "g-mem", title: "System Memory", max: 100, unit: "", color: "#3fb950",
    bg: "rgba(63,185,80,.10)", // タイル背景=線グラフの塗り潰し色を10%透過で
    dotBg: "rgba(63,185,80,.30)", // ■=2段目グラフの凡例ボックスと同一スタイル(塗り+枠)
    get: (m) => m.mem_used_pct, fmt: (v) => v.toFixed(1), sub: (m) => `${m.mem_used_gib.toFixed(1)} / ${m.mem_total_gib.toFixed(1)} GiB` },
  { id: "g-gpu-load", title: "GPU 負荷", max: 100, unit: "%", color: "#bc8cff",
    bg: "rgba(188,140,255,.10)", // タイル背景=線グラフの塗り潰し色を10%透過で

const toPct = (arr, max) => arr.map((v) => (v == null ? null : v / max * 100));

const lineDS = (label, data, color, fill) => ({

      { ...lineDS("メモリ使用率 %", series.memUsed, "#3fb950", "rgba(63,185,80,.30)"), fill: true },
      { ...lineDS("GPU負荷 %", series.gpuLoad, "#bc8cff", "rgba(188,140,255,.30)"), fill: true },
      lineDS("GPU温度 %", toPct(series.gpuTemp, NORM.cpuTemp), "#ff7b72"),
      lineDS("GPU電力 %", toPct(series.gpuPower, NORM.gpuPower), "#d29922"),
      lineDS("GPUクロック %", toPct(series.gpuClock, NORM.gpuClock), "#8b949e"), // グレー=ゲージラベルマーカーと同色
      lineDS("ストレージ使用率 %", series.diskUsed, "#79c0ff"),
      lineDS("ストレージ読込 %", toPct(series.diskRead, NORM.diskIO), "#56d364"),

function refreshMainChart() {

<script>
// ------------------------------------------------------------- Tier 3 (vLLM)
function setV(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "v" + (cls ? " " + cls : "");
}

// 入力/出力スループットの最終更新時刻(ms)。
// 「更新」= API が held=false で非 null を返した場合。null 値は更新とみなさない。
// 同時更新(同じポーリング)なら等値 → 両方白。
let tpsLastUpdate = { in: null, out: null };

function renderVllm(st) {
  const a = st.active;
  // 停止ボタン: 稼働中モデルがあり、かつジョブ実行中でないときのみ有効
  document.getElementById("btn-stop").disabled = !a || !!(st.switching);
  // ログボタン: 稼働中モデルがあるときのみ有効 (読み取り専用なので切替中も表示可)
  document.getElementById("btn-log").disabled = !a;
  // 切替ジョブ実行中は動作状況をコンテナ状態に同期する("切替中…" 赤)
  const swJob = st.switching && st.switching.kind === "switch" ? st.switching : null;
  if (!a) {
    setV("v-model", "稼働中のモデルなし");
    setV("v-status", swJob ? "切替中…" : "停止中", swJob ? "hot" : "down");
    return;
  }
  const stopJob = st.switching && st.switching.kind === "stop" ? st.switching : null;
  setV("v-model", a.model_name || a.profile);
  setV("v-port", a.port != null ? String(a.port) : "-");
  if (swJob) {
    // 切替中: 旧モデルがまだ稼働中 / 新モデルのAPI未応答の遷移期間も動作状況を表示
    setV("v-status", "切替中…", "hot");
  } else if (stopJob && stopJob.profile === a.profile) {
    // 稼働中 → 停止中…(赤) → 完了後は active が null になり「停止中」(灰)
    setV("v-status", "停止中…", "hot");
  } else {
    setV("v-status", a.health ? "稼働中 (API応答)" : "稼働中 (API応答なし)", a.health ? "up" : "warn");
  }
  setV("v-uptime", a.uptime_str || "-");
  const mt = a.metrics || {};
  const run = mt.requests_running != null ? Math.round(mt.requests_running) : "-";
  const wait = mt.requests_waiting != null ? Math.round(mt.requests_waiting) : "-";
  setV("v-rw", run === "-" && wait === "-" ? "-" : run + " / " + wait);
  setV("v-kv", mt.kv_cache_usage_pct != null ? mt.kv_cache_usage_pct.toFixed(1) + " %" : "-");
  setV("v-e2e", mt.e2e_latency_s != null ? mt.e2e_latency_s.toFixed(1) + " s" : "-");
  setV("v-ttft", mt.ttft_s != null ? mt.ttft_s.toFixed(2) + " s" : "-");
  // スループットの白/灰: 最終更新が新しい側が白、古くなった側が灰。
  // 同じポーリングで両方更新なら(同一時刻)次更新まで両白、片方が更新されなければ前回の色を維持。
  const nowTs = Date.now();
  const inUpdated = mt.prompt_tokens_per_s != null && !mt.prompt_tps_held;
  const outUpdated = mt.generation_tokens_per_s != null && !mt.generation_tps_held;
  if (inUpdated) tpsLastUpdate.in = nowTs;
  if (outUpdated) tpsLastUpdate.out = nowTs;
  const inWhite = tpsLastUpdate.in != null && tpsLastUpdate.in >= tpsLastUpdate.out;
  const outWhite = tpsLastUpdate.out != null && tpsLastUpdate.out >= tpsLastUpdate.in;
  setV("v-tps-in", mt.prompt_tokens_per_s != null ? mt.prompt_tokens_per_s.toFixed(1) + " tok/s" : "-",
    inWhite ? "" : "stale");
  setV("v-tps-out", mt.generation_tokens_per_s != null ? mt.generation_tokens_per_s.toFixed(1) + " tok/s" : "-",
    outWhite ? "" : "stale");
}

// ------------------------------------------------------------- ポーリング
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

async function poll() {
  try {
    const m = await fetchJson(API + "/api/metrics");
    pushPoint(m.timestamp, m);
    renderGauges(m);
    refreshMainChart();
  } catch (e) {
    console.error("metrics poll failed", e);
  }
  try {
    const st = await fetchJson(API + "/api/vllm/status");
    renderVllm(st);
    currentStatus = st;
    // モデル切替モーダルが開いている間は状態表示をライブ更新する
    if (!document.getElementById("modal-switch").classList.contains("hidden")) {
      renderModelList();
    }
  } catch (e) {
    console.error("vllm poll failed", e);
  }
  pollJob();
}

let currentStatus = null;
</script>

<script>
// ------------------------------------------------------------- モデル切替モーダル
let selectedProfile = null;

function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

function renderModelList() {
  const st = currentStatus || { containers: [], active: null };
  // 切替ジョブ実行中なら kind=switch の情報のみ状態表示に使う
  const sw = st.switching && st.switching.kind === "switch" ? st.switching : null;
  const list = document.getElementById("model-list");
  list.innerHTML = "";
  for (const c of st.containers) {
    const isCurrent = st.active && st.active.profile === c.profile;
    const isTarget = sw && sw.profile === c.profile;
    let cls = "", meta;
    if (isTarget) {
      // 切替対象 B: 未起動=停止中(灰) / 起動中かつAPI未応答=切替中…(赤) / API応答=現在稼働中(緑)
      if (!c.running) meta = "停止中";
      else if (!sw.ready) { cls = "switching"; meta = "切替中…"; }
      else { cls = "current"; meta = "現在稼働中"; }
    } else if (isCurrent) {
      cls = "current";
      meta = "現在稼働中";
    } else if (c.running && sw) {
      // 停止処理中の旧モデル A
      cls = "stopping";
      meta = "停止中…";
    } else {
      meta = (c.running ? "稼働中" : "停止中") + (c.uptime_str ? " (" + c.uptime_str + ")" : "");
    }
    const div = document.createElement("div");
    div.className = "model-item" + (cls ? " " + cls : "") + (c.profile === selectedProfile ? " selected" : "");
    div.innerHTML = `<span class="name">${c.profile}</span><span class="meta">${meta}</span>`;
    div.onclick = () => { selectedProfile = c.profile; renderModelList(); };
    list.appendChild(div);
  }
}

document.getElementById("btn-switch").onclick = async () => {
  selectedProfile = null;
  try {
    currentStatus = await fetchJson(API + "/api/vllm/status");
  } catch (e) { /* 表示のみ続行 */ }
  if (currentStatus && currentStatus.active) selectedProfile = currentStatus.active.profile;
  // 切替ログは常時表示(7行固定): 開いたときは内容クリアでプレースホルダー("ログ")表示
  document.getElementById("switch-log").textContent = "";
  // ジョブ実行中の場合は実行ボタンを無効化(完了時は pollJob が復元する)
  document.getElementById("switch-go").disabled = !!(currentStatus && currentStatus.switching);
  renderModelList();
  openModal("modal-switch");
};

document.getElementById("switch-close").onclick = () => closeModal("modal-switch");

document.getElementById("switch-go").onclick = async () => {
  if (!selectedProfile) return;
  const btn = document.getElementById("switch-go");
  btn.disabled = true;
  const logEl = document.getElementById("switch-log");
  logEl.style.display = "block";
  logEl.textContent = `切り替え開始: ${selectedProfile} ...\n`;
  try {
    const r = await fetch(API + "/api/vllm/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: selectedProfile }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      logEl.textContent += "エラー: " + (err.detail || r.status) + "\n";
      btn.disabled = false;
      return;
    }
    logEl.textContent += "バックグラウンド実行中。進捗は自動更新されます。\n";
  } catch (e) {
    logEl.textContent += "リクエスト失敗: " + e + "\n";
    btn.disabled = false;
  }
};
</script>

<script>
// ------------------------------------------------------------- モデル停止モーダル
document.getElementById("btn-stop").onclick = () => {
  const a = currentStatus && currentStatus.active;
  if (!a) return;
  const logEl = document.getElementById("stop-log");
  logEl.textContent = "";
  logEl.style.display = "none";
  document.getElementById("stop-msg").textContent = `${a.model_name || a.profile} を停止しますか?`;
  document.getElementById("stop-cancel").style.display = "";
  document.getElementById("stop-go").disabled = false;
  openModal("modal-stop");
};

document.getElementById("stop-cancel").onclick = () => closeModal("modal-stop");

document.getElementById("stop-go").onclick = async () => {
  const a = currentStatus && currentStatus.active;
  if (!a) return;
  const btn = document.getElementById("stop-go");
  const logEl = document.getElementById("stop-log");
  let failed = false;
  btn.disabled = true;
  document.getElementById("stop-cancel").style.display = "none";
  document.getElementById("stop-msg").textContent = "停止中です… (完了するとこのダイアログは自動で閉じます)";
  try {
    const r = await fetch(API + "/api/vllm/stop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: a.profile }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      document.getElementById("stop-msg").textContent = "";
      logEl.style.display = "block";
      logEl.textContent = "エラー: " + (err.detail || r.status) + "\n";
      failed = true;
    } else {
      logEl.style.display = "block";
    }
  } catch (e) {
    document.getElementById("stop-msg").textContent = "";
    logEl.style.display = "block";
    logEl.textContent = "リクエスト失敗: " + e + "\n";
    failed = true;
  }
  if (failed) {
    btn.disabled = false;
    document.getElementById("stop-cancel").style.display = "";
  }
};
</script>

<script>
// ------------------------------------------------------------- 実行ログモーダル
let logProfile = null;
let logLines = [];
let logSearchTerm = "";

document.getElementById("btn-log").onclick = () => {
  const a = currentStatus && currentStatus.active;
  if (!a) return;
  logProfile = a.profile;
  logSearchTerm = "";
  logLines = [];
  const input = document.getElementById("log-search-input");
  input.value = "";
  input.classList.add("hidden");
  document.getElementById("log-title").textContent =
    (a.model_name || a.profile) + "の実行ログ";
  loadLog();
  openModal("modal-log");
};

async function loadLog() {
  if (!logProfile) return;
  const el = document.getElementById("log-content");
  el.textContent = "読み込み中...";
  try {
    const r = await fetchJson(
      API + "/api/vllm/log?profile=" + encodeURIComponent(logProfile)
    );
    logLines = r.logs || [];
    renderLog();
  } catch (e) {
    el.textContent = "ログ取得失敗: " + e;
  }
}

function renderLog() {
  const el = document.getElementById("log-content");
  let lines = logLines;
  if (logSearchTerm) {
    lines = logLines.filter((l) => l.toLowerCase().includes(logSearchTerm));
  }
  el.textContent = lines.length ? lines.join("\n") : "(該当するログがありません)";
  el.scrollTop = el.scrollHeight; // 初期表示・更新後は末尾までスクロール
}

document.getElementById("log-refresh").onclick = () => loadLog();
document.getElementById("log-close").onclick = () => closeModal("modal-log");

document.getElementById("log-search").onclick = () => {
  const input = document.getElementById("log-search-input");
  input.classList.toggle("hidden");
  if (!input.classList.contains("hidden")) input.focus();
};

document.getElementById("log-search-input").oninput = (e) => {
  logSearchTerm = e.target.value.trim().toLowerCase();
  renderLog();
};

document.getElementById("log-download").onclick = () => {
  const text = logLines.join("\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (logProfile || "model") + ".log";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>

<script>
// ------------------------------------------------------------- パラメータモーダル
let paramsProfile = null;

document.getElementById("btn-params").onclick = async () => {
  const st = currentStatus;
  if (!st || !st.active) {
    alert("稼働中のモデルがありません");
    return;
  }
  paramsProfile = st.active.profile;
  document.getElementById("params-title").textContent =
    "パラメータ表示・編集 (" + paramsProfile + ")";
  const body = document.getElementById("params-body");
  body.innerHTML = "<tr><td colspan='2' class='meta'>読み込み中...</td></tr>";
  document.getElementById("recreate-log").style.display = "none";
  openModal("modal-params");
  try {
    const p = await fetchJson(API + "/api/vllm/params?profile=" + encodeURIComponent(paramsProfile));
    body.innerHTML = "";
    for (const row of p.params) {
      const tr = document.createElement("tr");
      const tdFlag = document.createElement("td");
      tdFlag.textContent = row.flag;
      const tdVal = document.createElement("td");
      const inp = document.createElement("input");
      inp.value = row.value ?? "";
      inp.readOnly = !row.editable;
      inp.dataset.flag = row.flag;
      tdVal.appendChild(inp);
      tr.appendChild(tdFlag);
      tr.appendChild(tdVal);
      body.appendChild(tr);
    }
  } catch (e) {
    body.innerHTML = "<tr><td colspan='2'>読み込み失敗: " + e + "</td></tr>";
  }
};

document.getElementById("params-close").onclick = () => closeModal("modal-params");

document.getElementById("params-save").onclick = async () => {
  const inputs = Array.from(document.querySelectorAll("#params-body input"))
    .filter((i) => !i.readOnly);
  const p = await fetchJson(API + "/api/vllm/params?profile=" + encodeURIComponent(paramsProfile));
  const updates = {};
  for (const inp of inputs) {
    const cur = (p.params.find((x) => x.flag === inp.dataset.flag) || {}).value;
    if (inp.value !== (cur ?? "")) updates[inp.dataset.flag] = inp.value;
  }
  if (!Object.keys(updates).length) {
    alert("変更がありません");
    return;
  }
  if (!confirm("変更内容でコンテナを再作成しますか?\n" +
    Object.entries(updates).map(([k, v]) => k + " = " + v).join("\n"))) return;

  const btn = document.getElementById("params-save");
  btn.disabled = true;
  const logEl = document.getElementById("recreate-log");
  logEl.style.display = "block";
  logEl.textContent = "compose 更新 + コンテナ再作成を開始...\n";
  try {
    const r = await fetch(API + "/api/vllm/params", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: paramsProfile, updates }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      logEl.textContent += "エラー: " + (err.detail || r.status) + "\n";
      btn.disabled = false;
      return;
    }
    logEl.textContent += "再作成中。進捗は自動更新されます。\n";
  } catch (e) {
    logEl.textContent += "リクエスト失敗: " + e + "\n";
    btn.disabled = false;
  }
};

// ------------------------------------------------------------- ジョブ進捗ポーリング
const JOB_LOG_IDS = { switch: "switch-log", recreate: "recreate-log", stop: "stop-log" };

async function pollJob() {
  let job;
  try {
    job = await fetchJson(API + "/api/vllm/job");
  } catch (e) {
    return;
  }
  if (!job.running) {
    // ジョブ終了(切替/再作成/停止): ログを非表示にし、ボタン復元 / モーダル閉じる
    if (job.kind) onJobDone(job);
    return;
  }
  const logEl = document.getElementById(JOB_LOG_IDS[job.kind]);
  logEl.style.display = "block";
  // 空行を詰めて表示する(スクリプトの上書き表示用の空行が多い)
  const lines = (job.log_tail || []).filter((l) => l.trim()).join("\n");
  logEl.textContent = `[${job.kind} ${job.profile}] ${job.elapsed_s}s 経過\n---\n${lines}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function onJobDone(job) {
  const isSwitch = job.kind === "switch";
  const logEl = document.getElementById(JOB_LOG_IDS[job.kind]);
  // 切替ログは完了後も表示を維持。再作成/停止のみ従来どおり非表示化
  if (!isSwitch && logEl.style.display !== "none") logEl.style.display = "none";
  if (isSwitch) {
    document.getElementById("switch-go").disabled = false;
    if (!document.getElementById("modal-switch").classList.contains("hidden")) {
      renderModelList();
    }
  } else if (job.kind === "stop") {
    // 停止完了で確認ダイアログを自動閉じる
    closeModal("modal-stop");
  } else {
    document.getElementById("params-save").disabled = false;
  }
}

// ------------------------------------------------------------- クロック
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("ja-JP", { hour12: false });
}, 1000);

// ------------------------------------------------------------- 起動
(async () => {
  // ページリロード後、サーバー側が保持する直近30分の履歴で時系列グラフをバックフィルする
  try {
    const hist = await fetchJson(API + "/api/history");
    for (const m of hist) pushPoint(m.timestamp, m);
    refreshMainChart();
  } catch (e) {
    console.error("history backfill failed", e);
  }
})();
poll();
setInterval(poll, POLL_MS);
</script>
